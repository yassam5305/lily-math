<style>
:root{
  --paper:#F5F7FA; --card:#FFFFFF; --ink:#1B2A41; --graphite:#5F6B7A; --line:#C8D1DC;
  --hi:#FFE566; --hi-ink:#6B5A00; --ok:#2F9E6B; --ok-bg:#E6F5EE; --no:#C9584F; --no-bg:#FBECEA;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{max-width:600px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
button,input,textarea{touch-action:manipulation}
.skills{display:grid;gap:10px}
.card.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.card.two .right{border-left:2px solid var(--line);padding-left:22px;min-height:100%}
@media (min-width:700px){
  .app{max-width:800px;padding-left:28px;padding-right:28px}
  h1{font-size:34px} .muted{font-size:18px}
  .skills{grid-template-columns:1fr 1fr}
  .skill{margin:0;padding:18px 18px} .skill .name{font-size:20px} .skill .blurb{font-size:15px}
  .btn{min-height:56px;font-size:18px;padding:14px 24px}
  .card{padding:26px 28px 28px}
  .prompt{font-size:22px} .big-num{font-size:48px} .big-words{font-size:30px}
  input.ans{font-size:34px;padding:14px 18px}
  .opt{font-size:19px;padding:16px 18px}
  .opts{grid-template-columns:1fr 1fr}
  .opts.long{grid-template-columns:1fr}
  .step{font-size:18px}
  .chart td{width:52px;height:56px;font-size:30px}
  .chart th{font-size:12px} .chart th span{height:88px}
  .chart td.point{font-size:34px}
  pre.stack{font-size:26px}
}
@media (min-width:1000px){
  .app{max-width:1120px}
  .card.two{grid-template-columns:5fr 6fr}
}
@media (max-width:999px){ .card.two{grid-template-columns:1fr} .card.two .right{border-left:none;padding-left:0;border-top:2px solid var(--line);padding-top:16px} }
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.01em}
h2{font-size:20px;margin:18px 0 6px}
.muted{color:var(--graphite)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:48px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn.primary{background:var(--ink);color:#fff}
.btn.quiet{border-color:var(--line);color:var(--graphite);font-weight:600}
.btn.small{padding:4px 10px;min-height:0;font-size:13px}
.btn.danger{border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* home */
.skill{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0;cursor:pointer}
.skill:hover{border-color:var(--ink)}
.skill .name{font-weight:700;font-size:18px}
.skill .blurb{color:var(--graphite);font-size:14px;margin-top:2px}
.dots{display:flex;gap:5px;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.dot.on{background:var(--ink)}
.dot.max{background:var(--hi-ink);border-color:var(--hi-ink)}
.mix{margin-top:14px;width:100%}
.actions .mix{flex:1 1 220px;width:auto}
.stats{margin-top:22px;font-size:14px}
.footer{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}

/* practice */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px 18px 20px;margin-top:12px}
.prompt{font-size:19px;margin:0 0 12px}
.big-num,.big-words{display:block;font-weight:800;font-size:34px;letter-spacing:.01em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.15}
.big-words{font-size:24px;font-weight:700}
sup{font-size:.6em}
input.ans{width:100%;font-size:28px;font-weight:700;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-variant-numeric:tabular-nums}
input.ans::placeholder{color:#B5BEC9;font-weight:500}
input.ans:disabled{background:#F0F3F7;color:var(--graphite);border-color:var(--line)}
.yours{font-size:13px;color:var(--graphite);margin:10px 0 4px}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#F0F3F7}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hints{margin-top:12px}
.hints .step{border-left-color:var(--graphite);font-size:15px;color:var(--graphite)}
.hints .step b{color:var(--ink)}
.hints .chart td{color:var(--ink)}
.inline-err{color:var(--no);font-size:14px;margin-top:6px;font-weight:600}

/* chart : the hero */
.chart{margin:14px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart table{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}
.chart th{font-weight:600;font-size:11px;color:var(--graphite);padding:0 3px 6px;vertical-align:bottom;line-height:1.1}
.chart th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);height:78px}
.chart td{border:2px solid var(--ink);width:38px;height:44px;text-align:center;font-size:24px;font-weight:800;background:#fff;position:relative}
.chart td.point{border:none;width:14px;background:transparent;font-size:28px;line-height:0;vertical-align:bottom;padding-bottom:6px}
.chart th.point{width:14px}
.chart td.ul{background:var(--hi)}
.chart td.ul::after{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:3px;background:var(--hi-ink);border-radius:2px}
.chart td.circle::before{content:"";position:absolute;inset:4px;border:3px solid var(--ink);border-radius:50%}
.chart td.slide{background:#EEF2F7}
.chart td.pad{color:#9AA5B3}
.chart.compact{margin:8px 0 0}
.chart.compact th span{height:0;display:none}
.chart.compact th{padding:0;height:0}
.chart-label{font-size:12px;color:var(--graphite);text-align:center;margin-top:6px;font-weight:600}
pre.stack{font-family:Menlo,Consolas,"Courier New",monospace;font-size:22px;font-weight:700;line-height:1.35;margin:10px auto 4px;display:table;text-align:right;background:#F7F9FC;border:2px solid var(--line);border-radius:10px;padding:10px 18px;font-variant-numeric:tabular-nums}
pre.stack .rule{display:block;border-top:3px solid var(--ink);margin-top:2px;padding-top:2px}
pre.stack .pad{color:#9AA5B3}
pre.stack .carry{font-size:.6em;color:var(--hi-ink);vertical-align:top}
pre.stack .cr{color:#B45309;font-weight:600}
.build{font-size:12px;margin-left:auto;align-self:center;white-space:nowrap}
.substep.why{border-style:solid;border-color:var(--ink);background:#fff}
.substep.pre{border:2px solid #E9D8B5;background:#FFFBEF;border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.substep.pre .cq{margin-bottom:6px}
.scratch{margin-top:16px}
.scratch-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:14px}
.scratch canvas{display:block;width:100%;height:300px;border:2px solid var(--line);border-radius:12px;background:#FFFEF8;touch-action:none;cursor:crosshair}
.btn[aria-pressed="true"]{border-color:var(--ink);background:#EEF2F7}

/* multiplication workspace: aligned digit cells, carry boxes, an app number pad */
.ws{margin:8px 0 4px}
.ws-grid{display:inline-grid;gap:4px 3px;margin:0 auto;padding:12px 14px 12px 8px;background:#F7F9FC;border:2px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.ws-wrap{text-align:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ws .cell{width:46px;height:52px;border:2px solid var(--line);border-radius:9px;background:#fff;font-size:26px;font-weight:800;text-align:center;line-height:48px;padding:0;color:var(--ink);cursor:pointer;font-family:Menlo,Consolas,"Courier New",monospace}
.ws .cell.sel{border-color:var(--ink);background:#FFFDF0}
.ws-entry-wrap{max-width:420px;margin:10px auto 0;text-align:left}
.ws-entry-label{display:block;font-size:14px;font-weight:800;color:var(--ink);margin:0 0 5px}
.ws-entry{display:block;width:100%;box-sizing:border-box;border:3px solid var(--ink);border-radius:11px;background:#fff;padding:10px 12px;font:800 26px/1.1 Menlo,Consolas,"Courier New",monospace;color:var(--ink);letter-spacing:.08em;text-align:right}
.ws-entry:focus{outline:4px solid var(--hi);outline-offset:2px}
.ws-entry:disabled{border-color:var(--line);background:#F0F3F7;color:var(--graphite)}
.ws-howto{font-size:14px;color:var(--graphite);text-align:center;margin:8px 0 0}
#wsrowlbl{font-weight:700;color:var(--ink);margin-top:10px}
.pad .btn.small-txt{font-family:inherit;font-size:15px}
.ws .cell.fixed{border-color:transparent;background:transparent;cursor:default;font-size:28px}
.ws .cell.locked{background:#F0F3F7;color:var(--graphite);cursor:default;border-style:dashed}
.ws .cell.carry{width:46px;height:30px;line-height:26px;font-size:16px;border-radius:7px;color:#B45309;border-color:#E9D8B5;background:#FFFBEF}
.ws .cell.carry:empty::before{content:"";}
.ws .cell.bad{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.ws .cell.good{border-color:var(--ok);background:var(--ok-bg)}
.ws .cell:disabled{cursor:default}

<body>
<div class="app" id="app"></div>
<script>
// ===== Number words =====
const ONES = ["", "one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["", "", "twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function words(n){
  n = Math.floor(n);
  if(n===0) return "zero";
  if(n<20) return ONES[n];
  if(n<100) return TENS[Math.floor(n/10)] + (n%10 ? "-"+ONES[n%10] : "");
  if(n<1000) return ONES[Math.floor(n/100)]+" hundred"+(n%100 ? " "+words(n%100) : "");
  if(n<1e6) return words(Math.floor(n/1000))+" thousand"+(n%1000 ? " "+words(n%1000) : "");
  return words(Math.floor(n/1e6))+" million"+(n%1e6 ? " "+words(n%1e6) : "");
}
const DEC_PLACES = ["tenths","hundredths","thousandths"];
const WHOLE_PLACES = ["ones","tens","hundreds","thousands","ten thousands","hundred thousands","millions","ten millions","hundred millions"];
const DEC_FRACTION = ["1/10","1/100","1/1000"];
const WHOLE_VALUE = ["1","10","100","1,000","10,000","100,000","1,000,000","10,000,000","100,000,000"];
const WHOLE_SING=["one","ten","hundred","thousand","ten thousand","hundred thousand","million","ten million","hundred million"];
const DEC_SING=["tenth","hundredth","thousandth"];
const MAX_LEVEL=5;

// A decimal number is {w: integer whole, d: string of decimal digits ("" allowed; trailing zeros kept if present)}
function fmt(num){ const w = num.w.toLocaleString("en-US"); return num.d ? w+"."+num.d : w; }
function numValue(num){ return parseFloat(num.w+"."+(num.d||"0")); }
function toWordForm(num){
  const parts=[];
  if(num.w>0) parts.push(words(num.w));
  if(num.d){
    const di = parseInt(num.d,10);
    const dw = words(di)+" "+DEC_PLACES[num.d.length-1];
    if(num.w>0) parts.push("and "+dw); else parts.push(dw);
  }
  if(!parts.length) return "zero";
  return parts.join(" ");
}
function trimDec(d){ return d.replace(/0+$/,""); }
function fromThousandths(V){ const w=Math.floor(V/1000); const d=String(V%1000).padStart(3,"0"); return {w, d: trimDec(d)}; }
function fixedFrom(V, places){ const w=Math.floor(V/1000); const d=String(V%1000).padStart(3,"0").slice(0,places); return {w,d}; }
function padTo(num,k){ return {w:num.w, d:(num.d||"").padEnd(k,"0")}; }
function toThousandths(num){ return num.w*1000 + parseInt((num.d||"").padEnd(3,"0"),10); }
function plural(n,s){ return n+" "+s+(n===1?"":"s"); }
function near(a,b){ return Math.abs(a-b)<1e-9; }

// ===== random helpers =====
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = arr=>arr[ri(0,arr.length-1)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }
function nonZeroDigits(k){ let s=""; for(let i=0;i<k;i++) s+=ri(1,9); return s; }
function digitsNoTrail(k){ if(k<=0) return ""; let s=""; for(let i=0;i<k-1;i++) s+=ri(0,9); return s+ri(1,9); }
function digitsWithLeadingZeros(k, z){ let s=""; for(let i=0;i<z;i++) s+="0"; s+=ri(1,9); for(let i=z+1;i<k;i++) s+=ri(0,9);
  if(s.endsWith("0")) s=s.slice(0,-1)+ri(1,9); return s; }

// ===== Checks (interactive substeps) =====
const ci=(q,answer,display)=>({q, type:"input", answer, display: display!==undefined ? String(display) : String(answer)});
const cm=(q,options,answer)=>({q, type:"mc", options, answer, display:options[answer]});
const wc=(check,comp)=>{ check.comp=comp; return check; }; // tag a check with the component it tests (a string, or a function of her answer → component)
// options with tags, de-duplicated by text, correct always kept
function buildOptions(correct, distractors){ // distractors: [{text, tag}]
  const seen=new Set([correct]); const list=[{text:correct, tag:"correct"}];
  for(const d of distractors){ if(d.text && !seen.has(d.text)){ seen.add(d.text); list.push(d); } if(list.length>=4) break; }
  const sh=shuffle(list);
  return {options:sh.map(o=>o.text), optionTags:sh.map(o=>o.tag), answer:sh.findIndex(o=>o.tag==="correct")};
}
function finalCheck(p){ // the last walkthrough step asks for the whole answer
  return p.type==="input" ? ci(`Now you finish it. Type the answer.`, p.answer, p.display) : cm(`Now you finish it. Pick the answer.`, p.options, p.answer);
}

// ===== Chart model =====
function chartModel(num, minWholeCols=1){
  const ws = String(num.w);
  const cols = Math.min(WHOLE_PLACES.length, Math.max(ws.length, minWholeCols));
  const whole=[];
  for(let i=cols-1;i>=0;i--){ const idx = ws.length-1-i; whole.push({place:WHOLE_PLACES[i], digit: idx>=0 ? ws[idx] : "", key:"w"+i}); }
  const dec=[];
  for(let i=0;i<3;i++) dec.push({place:DEC_PLACES[i], digit: (num.d && num.d[i]) || "", key:"d"+(i+1)});
  return {whole, dec};
}

// ===== Generators =====
// Each returns {skill, level, prompt, type, answer, options?, optionTags?, display, steps:[{t, chart?, charts?, hl?, minCols?, check?}], hints:[...], show, minCols?, meta}
// `focus` (optional) = {tag, ...} from focusFor(): steer the variant toward the mistake just made.

function genStandard(level, focus){
  const f=focus&&focus.tag;
  let w, d;
  if(level===1){ w=ri(1,9); d=nonZeroDigits(ri(1,2)); }
  else if(level===2){ w=ri(1,99); d=nonZeroDigits(3); }
  else if(level===3){ w=ri(1,99); d=digitsWithLeadingZeros(ri(2,3), 1); }
  else if(level===4){ const zeros=ri(1,2); const k=Math.max(zeros+1, ri(2,3)); w = Math.random()<0.5 ? 0 : ri(1,999); d=digitsWithLeadingZeros(k, zeros); }
  else { w=pick([0, ri(1,99), ri(100,999), ri(1000,9999)]); const z=ri(0,2); d = z ? digitsWithLeadingZeros(3,z) : nonZeroDigits(ri(1,3)); }
  if(f==="zeros"){ const k=Math.max(2,d.length); d=digitsWithLeadingZeros(k, ri(1,k-1)); }           // zeros after the dot were the problem
  if(f==="whole" && w===0) w=ri(1,99);                                                                   // whole part was the problem
  if(f==="no-whole") w=0;
  const num={w,d};
  const wf=toWordForm(num);
  const k=d.length, di=parseInt(d,10), dgs=String(di).length, place=DEC_PLACES[k-1];
  const steps=[];
  if(w>0) steps.push({t:`Find the word <b>and</b>. It marks the decimal point. Everything before it is the whole number part.`, check:ci(`What is the whole number?`, w, w.toLocaleString("en-US"))});
  else steps.push({t:`There is no word <b>and</b> in this problem. That means there is <b>no whole number</b>. A 0 holds the ones place.`, check:cm(`What goes to the left of the decimal point?`, ["0","Nothing, start with the decimal point","The first word"], 0)});
  steps.push({t:`The last word is <b>${place}</b>. So the last digit must be in the ${place} place.`, check:ci(`How many places after the decimal point is the ${place} place?`, k)});
  steps.push({t:`The decimal part says <b>${words(di)}</b>. As a plain number that is <b>${di}</b>, which has <b>${dgs}</b> digit${dgs>1?"s":""}.`});
  if(dgs<k) steps.push({t:`${dgs} is fewer than ${k}. Zeros go between the decimal point and the ${di}, so the last digit lands in the ${place} place.`, check:ci(`How many zeros go right after the decimal point?`, k-dgs)});
  else steps.push({t:`That is exactly ${k} digit${k>1?"s":""}, so <b>no zeros are needed</b>. The digits fill the places exactly.`, check:ci(`How many zeros go right after the decimal point?`, 0)});
  const p={skill:"standard", level, prompt:`Write the standard form for<br><span class="big-words">${wf}</span>`, type:"input", answer:numValue(num), display:fmt(num), show:"blank", meta:{num,k,dgs}};
  steps.push({t:`Put it together: whole number part, decimal point, ${k-dgs?plural(k-dgs,"zero")+", ":""}then ${di}.`, chart:num, check:finalCheck(p)});
  p.steps=steps;
  p.hints=[
    {t:`"And" marks the decimal point. The last word tells you which place the last digit is in.`},
    w>0 ? {t:`Everything before "and" is the whole number part: <b>${w.toLocaleString("en-US")}</b>. Write it, then the decimal point.`, chart:{w,d:""}}
        : {t:`No "and" means no whole number part. Start with <b>0</b> and the decimal point.`, chart:{w:0,d:""}},
    {t:`The last word is <b>${place}</b>, so the last digit must be ${k} place${k>1?"s":""} after the decimal point. If <b>${words(di)}</b> has fewer than ${k} digits, zeros fill the places right after the decimal point.`}
  ];
  return p;
}

function genWords(level, focus){
  const f=focus&&focus.tag;
  let w, d;
  if(level===1){ w=ri(1,20); d=nonZeroDigits(ri(1,2)); }
  else if(level===2){ w=ri(10,99); d=nonZeroDigits(3); }
  else if(level===3){ w=ri(1,99); d=digitsWithLeadingZeros(3,1); }
  else if(level===4){ w=ri(100,999); d=digitsWithLeadingZeros(3, ri(1,2)); }
  else { w=ri(100,9999); d=pick([nonZeroDigits(ri(1,3)), digitsWithLeadingZeros(3,1), digitsWithLeadingZeros(3,2)]); }
  if(f==="leading-zero") d=digitsWithLeadingZeros(3, ri(1,2));
  if(f==="place-name" && d.length<2) d=nonZeroDigits(ri(2,3));
  const num={w,d}; const correct=toWordForm(num);
  const k=d.length, di=parseInt(d,10);
  const D=[];
  if(k>1) D.push({text:words(w)+" and "+words(di)+" "+DEC_PLACES[k-2], tag:"place-name"});
  if(d[0]==="0") D.push({text:words(w)+" and "+words(di)+" "+DEC_PLACES[String(di).length-1], tag:"leading-zero"});
  if(k<3) D.push({text:words(w)+" and "+words(di)+" "+DEC_PLACES[k], tag:"place-name"});
  if(d.length>=2){ const twoDigit=parseInt(d.slice(0,2),10); if(twoDigit!==di && twoDigit>0) D.push({text:words(w)+" and "+words(twoDigit)+" "+DEC_PLACES[k-1], tag:"dropped-digit"}); }
  D.push({text:words(w)+" and "+words(di)+" "+DEC_PLACES[(k+1)%3], tag:"place-name"});
  D.push({text:words(w)+" and "+words(di), tag:"missing-place"});
  D.push({text:words(w+1)+" and "+words(di)+" "+DEC_PLACES[k-1], tag:"whole"});
  const o=buildOptions(correct, D);
  const hl={}; for(let i=1;i<=k;i++) hl["d"+i]="ul";
  const p={skill:"words", level, prompt:`Which is the word form for<br><span class="big-num">${fmt(num)}</span>`, type:"mc", options:o.options, optionTags:o.optionTags, answer:o.answer, display:correct, show:num, meta:{num,k}};
  p.steps=[
    {t:`Split at the decimal point. Whole number part: <b>${w.toLocaleString("en-US")}</b>. Decimal part: <b>${d}</b>.`, chart:num},
    {t:`Whole number part in words: <b>${words(w)}</b>. The decimal point is read as <b>and</b>.`},

function termFor(digit, key){
  if(key[0]==="w"){ const i=+key[1]; return i===0 ? `(${digit} × 1)` : `(${digit} × ${WHOLE_VALUE[i]})`; }
  const i=+key[1]; return `[${digit} × ${DEC_FRACTION[i-1]}]`;

  m.dec.forEach(c=>{ if(c.digit && c.digit!=="0") terms.push(termFor(c.digit,c.key)); });

function genShift(level, focus){
  const f=focus&&focus.tag;
  // 1) decide the operation and the factor (focus wins so the follow-up matches the miss)
  let op, factor;
  if(level===1){ op=pick(["×","÷"]); factor=10; }
  else if(level===2){ op=pick(["×","÷"]); factor=pick([10,100]); }
  else if(level===3){ op=pick(["×","÷"]); factor=pick([10,100]); }
  else if(level===4){ op="÷"; factor=pick([10,100]); }
  else { op=pick(["×","÷"]); factor=pick([10,100,1000]); }
  if(focus && focus.op) op=focus.op;
  if(focus && focus.factor && (f==="count"||f==="direction")) factor=focus.factor;
  if(focus && focus.fixed){ op=focus.fixed.op; factor=+focus.fixed.factor; }
  const n=Math.round(Math.log10(factor));
  // 2) build a number whose result still fits in the chart (at most 3 decimal places). For ÷ that means
  //    the number may have at most 3-n decimal digits; we regenerate until V is exactly divisible.
  let num, V, tries=0;
  do{
    if(level<=2) num={w:ri(11,99), d:""};

    else if(level===4) num = (factor===10 && Math.random()<0.5) ? {w:0, d:nonZeroDigits(2)} : {w:ri(10,99), d:""};
    else if(op==="×"){ num={w:ri(0,99), d:nonZeroDigits(ri(1,3))}; if(num.w===0 && Math.random()<0.5) num.d=digitsWithLeadingZeros(3,ri(1,2)); }
    else { const dl=3-n; num={w:ri(1,999), d: dl? nonZeroDigits(dl):""}; }
    if(op==="÷"){ const dl=3-n; if(num.d.length>dl) num.d=num.d.slice(0,dl); if(num.w===0 && !num.d) num.w=ri(11,99); }
    V=toThousandths(num);

  if(focus && focus.fixed){ num={w:+focus.fixed.num.w, d:String(focus.fixed.num.d||"")}; op=focus.fixed.op; factor=+focus.fixed.factor; V=toThousandths(num); }

  const RV = op==="×" ? V*factor : V/factor;
  const result=fromThousandths(RV);
  const dir = op==="×" ? "right" : "left";
  const zeros=n;
  const sup=String(n).split("").map(ch=>"⁰¹²³⁴⁵⁶⁷⁸⁹"[+ch]).join("");
  const p={skill:"shift", level, prompt:`<span class="big-num">${fmt(num)} ${op} ${factor.toLocaleString("en-US")} = ?</span>`, type:"input", answer:numValue(result), display:fmt(result), show:num, meta:{V,op,factor,n}};
  const opw = op==="×" ? "multiplying" : "dividing";
  const pattern=`10${sup} has ${plural(zeros,"zero")}, so the decimal point moves ${plural(n,"place")} to the ${dir} when ${opw}`;
  const wrongPat=[`10${sup} has ${plural(zeros,"zero")}, so the decimal point moves ${plural(n,"place")} to the ${dir==="right"?"left":"right"} when ${opw}`,
                  `10${sup} has ${plural(zeros,"zero")}, so the decimal point moves ${plural(n+1,"place")} to the ${dir} when ${opw}`];

    {t:`Write the power of ten in standard form: <b>${factor.toLocaleString("en-US")}</b> = 10${sup}. Count its zeros.`, check:ci(`How many zeros does ${factor.toLocaleString("en-US")} have?`, zeros)},
    {t:`Identify the operation. <b>Multiplying</b> by a power of ten makes the number greater, so the decimal point moves <b>right</b>. <b>Dividing</b> makes it less, so the decimal point moves <b>left</b>.`, check:cm(`This is ${op==="×"?"multiplication":"division"}. Which way does the decimal point move?`, ["Right","Left"], op==="×"?0:1)},
    {t:`Here is <b>${fmt(num)}</b>. ${num.d?"":"The decimal point of a whole number sits at the end: "+num.w.toLocaleString("en-US")+"."} Move the decimal point <b>${plural(n,"place")} ${dir}</b>, one place for each zero. Fill any empty places with 0.`, chart:num, hl:"all"},

// rounding helpers on thousandths integer V and place p (p>=0 whole 10^p, p<0 decimal)
function placeName(p){ return p>=0 ? WHOLE_PLACES[p] : DEC_PLACES[-p-1]; }
function placeSing(p){ return p>=0 ? WHOLE_SING[p] : DEC_SING[-p-1]; }
function placeKey(p){ return p>=0 ? "w"+p : "d"+(-p); }
function roundV(V,p){ const unit=Math.pow(10,p+3); return Math.floor((V+unit/2)/unit)*unit; }
function chopV(V,p){ const unit=Math.pow(10,p+3); return Math.floor(V/unit)*unit; }
function digitAt(V,p){ const unit=Math.pow(10,p+3); return Math.floor(V/unit)%10; }
function roundedNum(V,p){ const R=roundV(V,p); return p<0 ? fixedFrom(R,-p) : fromThousandths(R); }

function roundingSteps(num, p, prob){
  const V=toThousandths(num); const R=roundV(V,p); const C=chopV(V,p);
  const ul=digitAt(V,p), dec=digitAt(V,p-1); const up=dec>=5;
  const pn=placeName(p), key=placeKey(p), dkey=placeKey(p-1);
  const minCols=p>=0?p+1:1;
  const steps=[
    {t:`Underline the digit in the <b>${pn}</b> place (the rounding place).`, chart:num, hl:{[key]:"ul"}, minCols, check:ci(`Which digit is in the ${pn} seat?`, ul)},
    {t:`Circle the digit to the right of the underlined digit. Only the <b>circled digit</b> decides; the digits past it do not matter.`, chart:num, hl:{[key]:"ul",[dkey]:"circle"}, minCols, check:ci(`What is the deciding digit?`, dec)},
    {t:`If the circled digit is <b>5 or greater</b>, add one to the underlined digit. If it is <b>4 or less</b>, keep the underlined digit the same.`, check:cm(`The circled digit is ${dec}. What happens to the underlined ${ul}?`, [`Goes up to ${ul===9?"0, and 1 regroups to the place on the left":ul+1}`, `Stays ${ul}`], up?0:1)}
  ];
  // How far the regroup travels: the run of 9s starting at the rounding place. The digit just past the run goes up by one (or a new 1 appears).
  let run=0; if(up){ while(digitAt(V,p+run)===9 && run<12) run++; }
  const beyond=digitAt(V,p+run), topPlace=Math.floor(Math.log10(Math.max(1,V)))-3; // highest place that has a digit
  if(run>=1) steps.push({t: run===1
    ? `9 plus 1 is 10, so the 9 becomes <b>0</b> and you regroup 1 into the ${placeName(p+1)} place, just like regrouping in addition. The ${beyond} there becomes <b>${beyond+1}</b>.`
    : `9 plus 1 is 10, so the 9 becomes <b>0</b> and you regroup 1 to the left. The next digit is a 9 too, so it also becomes 0 and regroups again: all <b>${run}</b> of those 9s become 0s. The regroup lands in the ${placeName(p+run)} place, where ${p+run>topPlace?`a new <b>1</b> appears`:`the ${beyond} becomes <b>${beyond+1}</b>`}.`});
  steps.push({t: run>=1
    ? `Change all digits to the <b>right</b> of the underlined digit to <b>zeros</b>. The ${run===1?"9 that regrouped is now 0":run+" nines that regrouped are now 0s"}, the ${placeName(p+run)} digit went up by one, and every digit further left stays the same.`
    : `Change all digits to the <b>right</b> of the underlined digit to <b>zeros</b>. All digits to the <b>left</b> stay the same.`});
  const ans=roundedNum(V,p);
  let last=`Read the answer off the chart.`;
  if(p<0 && /0$/.test(ans.d)) last+=` Zeros at the end of a decimal can be dropped, so <b>${fmt(ans)}</b> can also be written <b>${fmt(fromThousandths(R))}</b>. Both are correct.`;
  if(R!==C) last+=` Dropping the extra digits without rounding would have given ${fmt(p<0?fixedFrom(C,-p):fromThousandths(C))}. That is not rounding; rounding can go up.`;
  steps.push({t:last, chart:ans, hl:{[key]:"ul"}, minCols, check: prob ? finalCheck(prob) : undefined});
  return {steps, R, C, ans, minCols, ul, dec};
}

function numForPlace(p){
  if(p<0) return {w:ri(0,999), d:nonZeroDigits(3)};
  if(p<=2) return {w:ri(100,99999), d: Math.random()<0.5?nonZeroDigits(ri(1,2)):""};
  return {w:ri(100000,9999999), d:""};

// Wrong values a learner gets for a × d when regrouped digits are lost: every regroup dropped, one regroup dropped, or no regrouping at all (each product written whole).
function mulRowSlips(a,d){
  const digs=String(a).split("").map(Number).reverse(); const out=new Set();
  const build=(dropAt)=>{ let carry=0, s=""; digs.forEach((g,j)=>{ const cin=dropAt(j)?0:carry; const sum=g*d+cin; const last=j===digs.length-1; s=(last?String(sum):String(sum%10))+s; carry=Math.floor(sum/10); }); return parseInt(s,10); };
  out.add(build(()=>true));
  for(let k=1;k<digs.length;k++) out.add(build(j=>j===k));
  out.add(parseInt(digs.slice().reverse().map(g=>String(g*d)).join(""),10));
  out.delete(a*d); return [...out];
}
function diagnoseMultiply(prob, v){
  const {a,b}=prob.meta; const ones=b%10, tens=Math.floor(b/10); let tag="other";
  if(!Number.isFinite(v)) return {tag, note:""};
  if(b>=10){
    if(near(v,a*ones+a*tens)) tag="shift-partial";
    else if(near(v,a*ones)||near(v,a*tens*10)||near(v,a*tens)) tag="missing-row";
    else { const s0=mulRowSlips(a,ones), s1=mulRowSlips(a,tens);
      const cands=[...s0.map(x=>x+a*tens*10), ...s1.map(x=>a*ones+x*10), ...s0.flatMap(x=>s1.map(y=>x+y*10))];
      if(cands.some(x=>near(x,v))) tag="carry"; }
  } else if(mulRowSlips(a,b).some(x=>near(x,v))) tag="carry";
  if(tag==="other" && b>=10){ const s=a*ones+a*tens*10; if(Math.abs(v-s)<=10 || (Math.abs(v-s)%10===0 && Math.abs(v-s)<=100)) tag="add-partials"; } // partial products fine, the column addition slipped
  if(tag==="other"){ const digits=String(a*b).length; if(Number.isInteger(v) && String(v).length===digits && Math.abs(v-a*b)<a*2) tag="fact"; } // right shape, close by: a single fact slipped
  return {tag, note:NOTES[tag]||""};
}

function _isoToDate(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
function _schoolDays(a,b){ let n=0; const d=new Date(a); while(d<=b){ const w=d.getDay(); if(w!==0&&w!==6) n++; d.setDate(d.getDate()+1); } return n; }
// Estimated lesson for a date: within a unit, spread its lessons evenly over the unit's school days; between units, sit on the previous unit's last lesson (review).
function lessonForDate(date){
  const d=new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const first=UNITS[0], last=UNITS[UNITS.length-1];
  if(d < _isoToDate(first.start)) return LESSONS.find(L=>L.unit===first.unit).id;
  for(let i=0;i<UNITS.length;i++){ const u=UNITS[i]; const st=_isoToDate(u.start), en=_isoToDate(u.end);
    const mine=LESSONS.filter(L=>L.unit===u.unit);
    if(d>=st && d<=en){ const total=Math.max(1,_schoolDays(st,en)); const done=Math.max(0,_schoolDays(st,d)-1); const idx=Math.min(mine.length-1, Math.floor(done/total*mine.length)); return mine[idx].id; }
    const nxt=UNITS[i+1]; if(d>en && (!nxt || d<_isoToDate(nxt.start))) return mine[mine.length-1].id;
  }
  const ml=LESSONS.filter(L=>L.unit===last.unit); return ml[ml.length-1].id;
}

// ---- decimal helpers: exact arithmetic in thousandths (integers), display through fmt ----
const D=(v)=>fromThousandths(Math.round(v)); // thousandths → {w,d}
const dV=(num)=>toThousandths(num);            // {w,d} → thousandths
const dMul=(x,y)=>Math.round(x*y/1000);        // thousandths × thousandths → thousandths

const numFrom=(w,d)=>({w, d:String(d||"").replace(/0+$/,"")});
const fmtV=v=>fmt(D(v));
const placeWord=k=>k===0?"ones":k===1?"tenths":k===2?"hundredths":"thousandths";
const unitCount=(n,k)=>`${n} ${n===1?placeWord(k).replace(/s$/,""):placeWord(k)}`; // "1 tenth", "28 tenths"

// ---- small pictures: a number line with jumps, a partitioned rectangle ----
function nlSVG(startV, jumps, endV){ // jumps: [{dv, label}], values in thousandths; direction from sign of dv
  const pts=[startV]; let v=startV; for(const j of jumps){ v+=j.dv; pts.push(v); }
  const lo=Math.min(...pts), hi=Math.max(...pts); const span=Math.max(hi-lo, 1); const W=560, H=110, x0=40, x1=W-40;
  const X=val=>x0+(val-lo)/span*(x1-x0);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:8px auto" role="img" aria-label="number line with jumps">`;
  svg+=`<line x1="${x0-20}" y1="78" x2="${x1+20}" y2="78" stroke="#1B2A41" stroke-width="2"/>`;
  pts.forEach((pv,i)=>{ const x=X(pv); svg+=`<line x1="${x}" y1="70" x2="${x}" y2="86" stroke="#1B2A41" stroke-width="2"/><text x="${x}" y="102" font-size="13" text-anchor="middle" fill="#1B2A41" font-weight="700">${fmtV(pv)}</text>`; });
  let cur=startV; jumps.forEach((j,i)=>{ const a=X(cur), b=X(cur+j.dv); const mid=(a+b)/2; const h=28+ (i%2)*10; const dir=j.dv>=0?1:-1;
    svg+=`<path d="M ${a} 74 Q ${mid} ${74-h*1.6} ${b} 74" fill="none" stroke="#B45309" stroke-width="2.5"/><polygon points="${b},74 ${b-6*dir},66 ${b-9*dir},76" fill="#B45309"/><text x="${mid}" y="${74-h}" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700">${j.label}</text>`; cur+=j.dv; });
  svg+=`</svg>`; return `<div class="chart">${svg}</div>`;
}
function areaSVG(partsA, partsB, cellText){ // partsA across the top, partsB down the side; sizes are the actual magnitudes, so the picture is a true area model. Narrow parts get a callout instead of a squeezed label.
  const W=560, left=70, top=34; const wA=partsA.map(p=>Math.max(1e-9,p.size)); const totA=wA.reduce((a,b)=>a+b,0); const hB=partsB.map(p=>Math.max(1e-9,p.size)); const totB=hB.reduce((a,b)=>a+b,0);
  const rows=Math.min(300, Math.max(90, 200*Math.min(1, totB/totA))); const H=top+rows+24; const scaleX=(W-left-20)/totA; const callouts=[]; let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:8px auto" role="img" aria-label="area model, drawn to scale">`;
  let x=left; partsA.forEach((p,i)=>{ const w=wA[i]*scaleX; const narrow=w<86; svg+=`<text x="${x+w/2}" y="22" font-size="${narrow?12:15}" text-anchor="middle" font-weight="700" fill="#1B2A41">${p.label}</text>`; let y=top; partsB.forEach((q,j)=>{ const h=hB[j]/totB*rows; const tight = narrow || h<30; svg+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${(i+j)%2?"#EEF2F7":"#FFF8D6"}" stroke="#1B2A41" stroke-width="2"/>`; if(tight){ const n=callouts.push(cellText(i,j)); svg+=`<text x="${x+w/2}" y="${y+h/2+5}" font-size="12" text-anchor="middle" fill="#B45309" font-weight="700">${n}</text>`; } else svg+=`<text x="${x+w/2}" y="${y+h/2+5}" font-size="14" text-anchor="middle" fill="#1B2A41">${cellText(i,j)}</text>`; y+=h; }); x+=w; });
  let y=top; partsB.forEach((q,j)=>{ const h=hB[j]/totB*rows; svg+=`<text x="${left-10}" y="${y+h/2+5}" font-size="${h<30?12:15}" text-anchor="end" font-weight="700" fill="#1B2A41">${q.label}</text>`; y+=h; });
  svg+=`</svg>`;
  // Slivers: any part thinner than 12px in the overview gets a magnified inset (same labels, not to scale, and it says so), so the tiny place-value pieces are inspectable.
  const thinA=partsA.map((p,i)=>({i, w:wA[i]*scaleX})).filter(o=>o.w<12), thinB=partsB.map((q,j)=>({j, h:hB[j]/totB*rows})).filter(o=>o.h<12);
  let insets="";
  if(thinA.length||thinB.length){ const cellW=150, cellH=44; const cols=thinA.length?thinA.map(o=>o.i):partsA.map((_,i)=>i); const rowsI=thinB.length?thinB.map(o=>o.j):partsB.map((_,j)=>j);
    const IW=70+cols.length*cellW+10, IH=30+rowsI.length*cellH+10; let ins=`<svg viewBox="0 0 ${IW} ${IH}" width="100%" style="max-width:${IW}px;display:block;margin:6px auto" role="img" aria-label="zoomed-in view of the thin parts, not to scale">`;
    cols.forEach((i,ci)=>{ ins+=`<text x="${70+ci*cellW+cellW/2}" y="18" font-size="13" text-anchor="middle" font-weight="700" fill="#1B2A41">${partsA[i].label}</text>`; });
    rowsI.forEach((j,rj)=>{ ins+=`<text x="60" y="${30+rj*cellH+cellH/2+4}" font-size="13" text-anchor="end" font-weight="700" fill="#1B2A41">${partsB[j].label}</text>`; cols.forEach((i,ci)=>{ ins+=`<rect x="${70+ci*cellW}" y="${30+rj*cellH}" width="${cellW}" height="${cellH}" fill="#FFF8D6" stroke="#B45309" stroke-width="2" stroke-dasharray="4 3"/><text x="${70+ci*cellW+cellW/2}" y="${30+rj*cellH+cellH/2+4}" font-size="13" text-anchor="middle" fill="#1B2A41">${cellText(i,j)}</text>`; }); });
    ins+=`</svg>`; insets=`<div class="chart-label">Zoomed in (not to scale): the thin ${thinA.length?"column"+(thinA.length>1?"s":""):"row"+(thinB.length>1?"s":"")} from the picture above</div>${ins}`; }
  return `<div class="chart">${svg}${callouts.length?`<div class="chart-label">${callouts.map((c,i)=>`<b>${i+1}</b>: ${c}`).join(" &nbsp;·&nbsp; ")}</div>`:""}${insets}</div>`;
}

// ---- Unit 4: multiply decimals (area model / distributive property; decimal × whole, decimal × decimal) ----
function decParts(num){ // place-value parts of a decimal as thousandths: 12.35 → [10000? no: 12000, 300, 50] ; whole part kept as one chunk unless two digits (then tens + ones)
  const out=[]; const w=num.w; if(w>=10){ out.push(Math.floor(w/10)*10*1000); if(w%10) out.push((w%10)*1000); } else if(w>0) out.push(w*1000);
  const d=(num.d||"").padEnd(3,"0"); [100,10,1].forEach((unit,i)=>{ const dg=+d[i]; if(dg) out.push(dg*unit); }); return out;
}
function genDecMul(level, focus){
  const f=focus&&focus.tag; let variant = focus&&focus.variant ? focus.variant : pick(["area","distributive"]); let kind = focus&&focus.kind ? focus.kind : (level<=3 ? "whole" : "decimal");
  let A,B; // A decimal, B whole (kind whole) or decimal (kind decimal); stored as {w,d}
  const draw=()=>{
    if(kind==="whole"){
      if(level===1){ A=numFrom(ri(1,9), String(ri(1,9))); B={w:ri(2,9),d:""}; }
      else if(level===2){ A=numFrom(ri(1,9), String(ri(1,9))+String(ri(1,9))); B={w:ri(2,9),d:""}; }
      else if(level===3){ A=numFrom(ri(1,9), Math.random()<0.5?String(ri(1,9)):String(ri(1,9))+String(ri(1,9))); B={w:ri(11,29),d:""}; }
      else { A=numFrom(ri(0,9), String(ri(1,9))+String(ri(0,9))); B={w:ri(2,39),d:""}; }
    } else {
      if(level<=4){ A=numFrom(ri(0,9), String(ri(1,9))); B=numFrom(ri(0,9), String(ri(1,9))); } // tenths × tenths → hundredths
      else { A=numFrom(ri(0,9), String(ri(1,9))); B=numFrom(ri(0,9), String(ri(1,9))); if(Math.random()<0.5) A=numFrom(0, String(ri(1,9))); } // often a factor below 1
      if(dV(A)===0) A=numFrom(1,"5"); if(dV(B)===0) B=numFrom(1,"5");
    }
    if(f==="point" && kind==="decimal" && dV(B)>=1000) B=numFrom(0, String(ri(2,9))); // a factor under 1 makes the point-placement decision matter
  };
  draw();
  if(focus && focus.fixed){ A={w:+focus.fixed.a.w, d:String(focus.fixed.a.d||"")}; B={w:+focus.fixed.b.w, d:String(focus.fixed.b.d||"")}; kind = B.d ? "decimal" : "whole"; }
  const V=dMul(dV(A), dV(B)); const ans=D(V);
  const pa=decParts(A), pb = kind==="whole" ? (B.w>=10 ? [Math.floor(B.w/10)*10*1000, (B.w%10)*1000].filter(x=>x>0) : [B.w*1000]) : decParts(B);
  const sections=[]; pa.forEach(x=>pb.forEach(y=>sections.push({x,y,v:dMul(x,y)})));
  // A factor under 1 keeps one significant digit (0.47 → 0.5, 0.1 → 0.1, 0.09 → 0.1); a factor of 1 or more rounds to a whole number. The estimate
  // is a product of those benchmarks, so "smaller than either factor" stays true whenever both are under 1 (invariant checked in the release tests).
  const roundOrKeep=v=> v<1000 ? (v>=100 ? Math.round(v/100)*100 : Math.max(10, Math.round(v/10)*10)) : Math.round(v/1000)*1000;
  const sig1=(v,floor)=>{ if(v<=0) return 0; const mag=Math.pow(10, Math.floor(Math.log10(v))); return (floor?Math.floor(v/mag):Math.round(v/mag))*mag; }; // one significant digit, in thousandths
  // Benchmarks stay in the factor's own decade: under 1 → one significant digit, capped at 0.9; 1 or more → nearest whole number. (v9.8.1 capped every factor; fixed.)
  const bench=v=> v<1000 ? Math.min(900, roundOrKeep(v)) : roundOrKeep(v);
  let estA=bench(dV(A)), estB = kind==="whole" ? dV(B) : bench(dV(B));
  let est=dMul(estA,estB);
  // If the benchmarks reproduce the exact product (tenths × tenths), coarsen one factor to a half so the estimate stays an estimate.
  const halfOf=v=>Math.max(500, Math.round(v/500)*500); const nearEnough=(orig,c)=>c>=orig/2 && c<=orig*2; // a benchmark may not distort a factor by more than 2× (0.1 is never "about 0.5")
  if(est===V && dV(B)<1000){ const b2=halfOf(dV(B)); if(nearEnough(dV(B),b2) && dMul(estA,b2)!==V){ estB=b2; est=dMul(estA,estB); } }
  if(est===V && dV(A)<1000){ const a2=halfOf(dV(A)); if(nearEnough(dV(A),a2) && dMul(a2,estB)!==V){ estA=a2; est=dMul(estA,estB); } }
  // Invariant: the estimate agrees with the magnitude claim on screen. Both factors under 1 → estimate below both; one factor under 1 → estimate below the other factor.
  const bound = (dV(A)<1000 && dV(B)<1000) ? Math.min(dV(A),dV(B)) : dV(A)<1000 ? dV(B) : (kind==="decimal" && dV(B)<1000) ? dV(A) : Infinity;
  if(!(est>0 && est<bound)){ for(const cand of [sig1(V,false), sig1(V,true), Math.max(1,Math.floor(V/2))]){ if(cand>0 && cand<bound && cand!==V){ est=cand; break; } } }
  const estIsExact = est===V; // only possible when every coarsening collapses (e.g. 0.5 × 0.5); then the screen speaks in bounds, not a number
  const model = variant==="area" ? "area model" : "distributive property";
  const p={skill:"decmul", level, prompt:`<span class="big-num">${fmt(A)} × ${fmt(B)} = ?</span>`, type:"input", answer:V/1000, display:fmt(ans), show:null,
    meta:{a:A, b:B, kind, variant, V, sections:sections.map(s=>s.v), est, places:decPlaces(A)+decPlaces(B)}};
  p.traps=["point","partition","fact"]; if(sections.length>1) p.traps.push("sections");
  const partsLabel=n=>n.map(v=>fmtV(v)).join(" + ");
  const fig=areaSVG(pa.map(v=>({label:fmtV(v), size:v})), pb.map(v=>({label:fmtV(v), size:v})), (i,j)=>`${fmtV(pa[i])} × ${fmtV(pb[j])}`); // drawn to scale
  const steps=[];
  const smallA = dV(A)<1000, smallB = kind==="decimal" && dV(B)<1000;
  const estText = estIsExact ? `${smallA&&smallB?`Both factors are less than 1, so the answer is <b>smaller than either of them</b>, less than ${fmtV(Math.min(dV(A),dV(B)))}.`:`One factor is less than 1, so the answer is <b>less than ${fmt(bound===dV(A)?A:B)}</b>.`}` : smallA && smallB ? `Both factors are less than 1, so the answer is <b>smaller than either of them</b>: ${fmt(A)} is about ${fmtV(estA)} and ${fmt(B)} is about ${fmtV(estB)}, so about ${fmtV(est)}.` : smallB ? `${fmt(B)} is less than 1, so the answer is <b>less than ${fmt(A)}</b> (multiplying by a number under 1 makes it smaller). ${fmt(B)} is about ${fmtV(estB)}, so the answer is about ${fmtV(est)}.` : smallA ? `${fmt(A)} is less than 1, so the answer is <b>less than ${fmt(B)}</b>. ${fmt(A)} is about ${fmtV(estA)}, so about ${fmtV(est)}.` : `${fmt(A)} is about ${fmtV(estA)}${kind==="decimal"?` and ${fmt(B)} is about ${fmtV(estB)}`:""}, so the answer should be near ${fmtV(estA)} × ${fmtV(estB)} = <b>${fmtV(est)}</b>.`;
  // When the benchmark product happens to equal the exact answer, the check asks about direction instead of size, so the estimate never hands over the answer.
  const bigger = dV(A)>=dV(B) ? A : B;
  steps.push({t:`<b>Estimate first.</b> ${estText} Keep that in mind for the decimal point at the end.`,
    check: estIsExact ? wc(cm(`Will the answer be more or less than ${fmt(bigger)}?`, ["More","Less"], (smallA||smallB)?1:0),"point") : wc(cm(`About how big should ${fmt(A)} × ${fmt(B)} be?`, shuffle([...new Set([fmtV(est), fmtV(est*10), fmtV(Math.max(1,Math.round(est/10)))])]), null),"point")});
  if(!estIsExact){ steps[0].check.answer=steps[0].check.options.indexOf(fmtV(est)); steps[0].check.display=steps[0].check.options[steps[0].check.answer]; }
  steps.push({t: variant==="area" ? `<b>Area model.</b> Break each number into its place-value parts: ${fmt(A)} = ${partsLabel(pa)}${pb.length>1?` and ${fmt(B)} = ${partsLabel(pb)}`:""}. Each section of the rectangle is one small product.${fig}`
                                    : `<b>Distributive property.</b> Break the numbers into place-value parts: ${fmt(A)} = ${partsLabel(pa)}${pb.length>1?`, ${fmt(B)} = ${partsLabel(pb)}`:""}. Then ${fmt(A)} × ${fmt(B)} = ${sections.map(s=>`(${fmtV(s.x)} × ${fmtV(s.y)})`).join(" + ")}.`,
    check:wc(ci(`How many small products (sections) are there?`, sections.length),"partition")});
  sections.forEach(s=>{ const xd=decPlaces(D(s.x)), yd=decPlaces(D(s.y)); const unitNote = (xd||yd) ? ` Think in ${placeWord(xd+yd)}: ${fmtV(s.x)} × ${fmtV(s.y)} is ${(s.x/Math.pow(10,3-xd))*(s.y/Math.pow(10,3-yd))} ${placeWord(xd+yd)}, which is ${fmtV(s.v)}.` : "";
    steps.push({t:`Section <b>${fmtV(s.x)} × ${fmtV(s.y)}</b>.${unitNote}`, check:wc(ci(`${fmtV(s.x)} × ${fmtV(s.y)} = ?`, s.v/1000, fmtV(s.v)),"fact")}); });
  if(sections.length>1) steps.push({t:`Add the sections: ${sections.map(s=>fmtV(s.v)).join(" + ")}. Line up the decimal points when you add.`, check:wc(ci(`${sections.map(s=>fmtV(s.v)).join(" + ")} = ?`, V/1000, fmt(ans)),"sections")});
  steps.push({t:`<b>Check the decimal point</b> against the estimate: ${fmt(ans)} ${smallA||smallB?`is smaller than ${smallA&&smallB?"both factors":smallB?fmt(A):fmt(B)}, as it should be`:`is near ${fmtV(est)}`}, so it makes sense.${p.meta.places?` (${fmt(A)} has ${plural(decPlaces(A),"decimal place")}${kind==="decimal"?` and ${fmt(B)} has ${plural(decPlaces(B),"decimal place")}`:""}; the product has ${plural(p.meta.places,"decimal place")} before any end zeros are dropped.)`:""}`, check:wc(finalCheck(p),"point")});
  p.steps=steps;
  p.hints=[
    {t:`Estimate first. ${estText} That tells you where the decimal point belongs at the end.`},
    {t:`Break the numbers into place-value parts and multiply every part: ${fmt(A)} is ${partsLabel(pa)}${pb.length>1?`, ${fmt(B)} is ${partsLabel(pb)}`:""}. (SWUN: the <b>${model}</b>.)`},

function diagnoseDecMul(prob, v){

function diagnoseDecDiv(prob, v){

// ---- Unit 3 representations: number-line jumps and the place-value chart for adding and subtracting decimals ----
function nlSteps(p){ // replaces the column steps with number-line jumps when the lesson asks for the number-line strategy
  const {nums,op}=p.meta; if(nums.length!==2) return null; const A=dV(nums[0]), B=dV(nums[1]); const sign = op==="+" ? 1 : -1;
  const parts=decParts(nums[1]).sort((x,y)=>y-x); // biggest jump first: whole, then tenths, then hundredths
  const jumps=parts.map(v=>({dv:sign*v, label:`${op==="+"?"+":"−"}${fmtV(v)}`}));
  const steps=[{t:`<b>Number-line strategy.</b> Start at <b>${fmt(nums[0])}</b>. ${op==="+"?"Jump forward":"Jump back"} by the parts of ${fmt(nums[1])}: ${parts.map(v=>fmtV(v)).join(", then ")}. Big jump first, then the smaller ones.${nlSVG(A, jumps)}`, check:ci(`How many jumps will you make?`, jumps.length)}];
  let cur=A; jumps.forEach((j,i)=>{ const nxt=cur+j.dv; steps.push({t:`Jump ${i+1}: from ${fmtV(cur)}, ${op==="+"?"forward":"back"} <b>${fmtV(Math.abs(j.dv))}</b>.${nlSVG(A, jumps.slice(0,i+1))}`, check:wc(ci(`${fmtV(cur)} ${op} ${fmtV(Math.abs(j.dv))} = ?`, nxt/1000, fmtV(nxt)),"jump")}); cur=nxt; });
  steps.push({t:`You landed on <b>${fmt(p.meta.result||D(cur))}</b>. The last landing point is the answer.`, check:finalCheck(p)});
  return steps;
}
function chartSteps(p){ // U3 L1/L4: build both numbers on the place-value chart, then add or subtract place by place (same arithmetic as the column steps, with the chart in view)
  const {nums,op,k}=p.meta; if(nums.length!==2) return null; const padded=nums.map(n=>padTo(n,k));
  const first={t:`<b>Build both numbers on the place value chart.</b> Same number of decimal digits for each (add zeros on the end), so every column lines up.`, charts:padded, check:wc(ci(`How many decimal digits should each number have?`, k),"chart")};
  return [first].concat(p.steps.slice(1));
}
const _genAddSubBase=genAddSub;
genAddSub=function(level, focus){ const v=focus&&focus.variant; const rep_=(v==="numberline"||v==="chart"); const lv = rep_ && level>=5 ? 4 : level; // the representation lessons use two numbers (level 5 adds three)

// ---- powers of ten: the digits change place (supplementing "move the decimal point") ----
const _genShiftBase=genShift;
genShift=function(level, focus){ const p=_genShiftBase(level, focus); const m=p.meta||{}; if(!m.factor||!m.op) return p;
  try{ const num=fromThousandths(m.V); const s=String(num.w)+(num.d||""); const digits=s.replace(/^0+(?=\d)/,""); const n=m.n||Math.round(Math.log10(m.factor)); const dir=m.op==="×"?"left":"right";
    const places=["ones","tenths","hundredths","thousandths"]; const wholeNames=["ones","tens","hundreds","thousands","ten thousands"];
    const nameOf=(k)=> k>=0 ? wholeNames[k]||"far left" : places[-k]||"far right"; // k = place index, 0 = ones, negative = decimals

// ---- Unit 2 L6: the area model made visible, and connected to the algorithm's partial products ----

  const groups=[]; // period label + how many of its columns are present, in display order (left to right)
  for(const p of places){ const idx=WHOLE_PLACES.indexOf(p); const label=PERIODS[Math.floor(Math.max(0,idx)/3)]||"";

  if(sp.two && (rows.r0===null || rows.r1===null)) return {err:"Fill in both partial products, then the total on the bottom row."};
  if(rows.t===null) return {err:"Fill in the answer on the bottom row."};

  // An empty box inside a number is almost always an unfinished entry, so it is sent back to be filled, with one exception: the tens row's

  const note=(k,comp)=>{ wrong.push(k); marks[k]="bad"; if(comp){ comps.push(comp); tally[comp]=tally[comp]||{ok:0,miss:0}; tally[comp].miss++; } };
  const digitOK=(k)=>{ const e=sp.exp[k]; const v=V[k]; if(e===undefined) return v===undefined||v===""||v==="0"; return v===e; };

      <h2 style="margin-top:0">What this app covers</h2>
      <p class="muted" style="font-size:14px;margin:0 0 8px">Mapped to the California Mathematics Framework, Grade Five (CDE), which uses the Common Core standard codes. This app is decimal place-value practice; it is not a full fifth-grade program.</p>
      <div style="overflow-x:auto"><table class="report"><tr><th>Skill here</th><th>Standard</th></tr>${SKILL_ORDER.map(k=>`<tr><td>${SKILLS[k].name}</td><td>${SKILLS[k].std}</td></tr>`).join("")}</table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">${esc(notYet)}</p>
      ${notYetUnitsHTML}
    </div>
    <div class="card">
      <h2 style="margin-top:0">Danger zone</h2>
      <div class="actions" style="margin-top:0"><button class="btn danger" id="reset">Reset ${esc(S.name)}'s levels</button><button class="btn danger" id="remove">Remove player ${esc(S.name)}</button></div>
    </div>`;
  const q=id=>app.querySelector("#"+id);
  q("back").onclick=home; q("back").focus({preventScroll:true});
  const setClassMode=()=>{ const m=q("classmode"); if(m) m.innerHTML=classModeHTML(); };
  if(q("paperSave")) q("paperSave").onclick=()=>{ const sk=q("paperSk").value; const qtxt=String(q("paperQ").value||"").trim(); const okv=(app.querySelector("input[name=paperOk]:checked")||{}).value==="1"; const helped=q("paperHelp").checked; const changedForm=q("paperForm").checked;
    if(!SKILLS[sk]) return; pushLog({t:Date.now(), sk, q: qtxt?`paper: ${qtxt}`:"paper problem", yours:"", ans:"", ok:okv?1:0, stage:"paper", hints:0, independent:0, transfer:1, parentScored:1, helped:helped?1:0, changedForm:changedForm?1:0, lvl:S.levels[sk]});
    if(!okv){ noteComp(sk, "*", false, {lvl:S.levels[sk]}); } // a paper miss opens the skill for Focus, like any miss
    save(); grownups(); const msg=app.querySelector("#paperMsg"); if(msg) msg.textContent="Recorded."; };
  if(q("saveclass")) q("saveclass").onclick=()=>{ const id=q("classat").value; const l=lessonById(id);
    if(!l){ q("classsaved").textContent="Pick a lesson from the list."; return; }
    S.classPin=l.id; const okSave=save(); q("classsaved").textContent=okSave?`Pinned: ${lessonShort(l)}.`:"Pinned for now, but this device refused to save it."; setClassMode(); };
  if(q("followcal")) q("followcal").onclick=()=>{ S.classPin=null; const okSave=save(); const id=calendarClassAt(); if(id) q("classat").value=id;
    q("classsaved").textContent=okSave?`Following the calendar: ${id?lessonShortById(id):"—"} today.`:"Following the calendar for now, but this device refused to save it."; setClassMode(); };
  q("copy").onclick=async()=>{ const ta=q("export"); ta.select(); let done=false; try{ await navigator.clipboard.writeText(ta.value); done=true; }catch(e){ try{ done=document.execCommand("copy"); }catch(e2){} } q("copied").textContent=done?"Copied.":"Select the text and copy it by hand."; };
  q("doimport").onclick=async()=>{ q("imperr").textContent="Checking…"; const r=await importBackupText(q("import").value); if(!r.ok){ q("imperr").textContent=r.err; return; } if(r.err){ q("imperr").textContent=r.err; return; } home(); };
  const codeFor=async()=>makeTransferCode(DB, q("tchist").checked);
  const copyText=async(text)=>{ let done=false; try{ await navigator.clipboard.writeText(text); done=true; }catch(e){ const ta=q("tcode"); ta.hidden=false; ta.value=text; ta.select(); try{ done=document.execCommand("copy"); }catch(e2){} } return done; };
  q("tcopy").onclick=async()=>{ q("tmsg").textContent="Building…"; try{ const code=await codeFor(); const ok=await copyText(code); q("tmsg").textContent= ok ? `Copied (${fmtBytes(code.length)}). Now paste it into Restore on the new iPad.` : "Could not copy automatically; the code is shown below, select it and copy by hand."; if(!ok){ q("tcode").hidden=false; q("tcode").value=code; } }catch(e){ q("tmsg").textContent="Could not build the code: "+(e.message||e); } };
  if(q("tshare")) q("tshare").onclick=async()=>{ try{ const code=await codeFor(); await navigator.share({title:"Math Practice transfer code", text:code}); q("tmsg").textContent="Shared. On the new iPad, copy the code from where it landed and paste it into Restore."; }catch(e){ if(e && e.name!=="AbortError") q("tmsg").textContent="Sharing did not work here; use Copy instead."; } };
  q("tshow").onclick=async()=>{ const ta=q("tcode"); if(!ta.hidden){ ta.hidden=true; q("tshow").textContent="Show the code"; return; } ta.value="Building…"; ta.hidden=false; ta.value=await codeFor(); q("tshow").textContent="Hide the code"; };
  q("reset").onclick=()=>{ if(confirm(`Erase ${S.name}'s levels and history and start from level 1?`)){ const n=S.name; S=normalize(blankProfile(n)); DB.profiles[n]=S; save(); home(); } };
  q("remove").onclick=()=>{ if(confirm(`Remove ${S.name} completely? This cannot be undone (unless you saved a backup).`)){ delete DB.profiles[S.name]; DB.current=null; S=null; save(); home(); } };
}
home();

</script>
</body>
</html>
