<style>
:root{
  --paper:#F5F7FA; --card:#FFFFFF; --ink:#1B2A41; --graphite:#5F6B7A; --line:#C8D1DC;
  --hi:#FFE566; --hi-ink:#6B5A00; --ok:#2F9E6B; --ok-bg:#E6F5EE; --no:#C9584F; --no-bg:#FBECEA;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{max-width:600px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
button,input,textarea{touch-action:manipulation}
.skills{display:grid;gap:10px}
.card.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.card.two .right{border-left:2px solid var(--line);padding-left:22px;min-height:100%}
@media (min-width:700px){
  .app{max-width:800px;padding-left:28px;padding-right:28px}
  h1{font-size:34px} .muted{font-size:18px}
  .skills{grid-template-columns:1fr 1fr}
  .skill{margin:0;padding:18px 18px} .skill .name{font-size:20px} .skill .blurb{font-size:15px}
  .btn{min-height:56px;font-size:18px;padding:14px 24px}
  .card{padding:26px 28px 28px}
  .prompt{font-size:22px} .big-num{font-size:48px} .big-words{font-size:30px}
  input.ans{font-size:34px;padding:14px 18px}
  .opt{font-size:19px;padding:16px 18px}
  .opts{grid-template-columns:1fr 1fr}
  .opts.long{grid-template-columns:1fr}
  .step{font-size:18px}
  .chart td{width:52px;height:56px;font-size:30px}
  .chart th{font-size:12px} .chart th span{height:88px}
  .chart td.point{font-size:34px}
  pre.stack{font-size:26px}
}
@media (min-width:1000px){
  .app{max-width:1120px}
  .card.two{grid-template-columns:5fr 6fr}
}
@media (max-width:999px){ .card.two{grid-template-columns:1fr} .card.two .right{border-left:none;padding-left:0;border-top:2px solid var(--line);padding-top:16px} }
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.01em}
h2{font-size:20px;margin:18px 0 6px}
.muted{color:var(--graphite)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:48px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn.primary{background:var(--ink);color:#fff}
.btn.quiet{border-color:var(--line);color:var(--graphite);font-weight:600}
.btn.small{padding:4px 10px;min-height:0;font-size:13px}
.btn.danger{border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* home */
.skill{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0;cursor:pointer}
.skill:hover{border-color:var(--ink)}
.skill .name{font-weight:700;font-size:18px}
.skill .blurb{color:var(--graphite);font-size:14px;margin-top:2px}
.dots{display:flex;gap:5px;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.dot.on{background:var(--ink)}
.dot.max{background:var(--hi-ink);border-color:var(--hi-ink)}
.mix{margin-top:14px;width:100%}
.stats{margin-top:22px;font-size:14px}
.footer{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}

/* practice */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px 18px 20px;margin-top:12px}
.prompt{font-size:19px;margin:0 0 12px}
.big-num,.big-words{display:block;font-weight:800;font-size:34px;letter-spacing:.01em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.15}
.big-words{font-size:24px;font-weight:700}
sup{font-size:.6em}
input.ans{width:100%;font-size:28px;font-weight:700;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-variant-numeric:tabular-nums}
input.ans::placeholder{color:#B5BEC9;font-weight:500}
input.ans:disabled{background:#F0F3F7;color:var(--graphite);border-color:var(--line)}
.yours{font-size:13px;color:var(--graphite);margin:10px 0 4px}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#F0F3F7}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hints{margin-top:12px}
.hints .step{border-left-color:var(--graphite);font-size:15px;color:var(--graphite)}
.hints .step b{color:var(--ink)}
.hints .chart td{color:var(--ink)}
.inline-err{color:var(--no);font-size:14px;margin-top:6px;font-weight:600}

/* chart : the hero */
.chart{margin:14px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart table{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}
.chart th{font-weight:600;font-size:11px;color:var(--graphite);padding:0 3px 6px;vertical-align:bottom;line-height:1.1}
.chart th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);height:78px}
.chart td{border:2px solid var(--ink);width:38px;height:44px;text-align:center;font-size:24px;font-weight:800;background:#fff;position:relative}
.chart td.point{border:none;width:14px;background:transparent;font-size:28px;line-height:0;vertical-align:bottom;padding-bottom:6px}
.chart th.point{width:14px}
.chart td.ul{background:var(--hi)}
.chart td.ul::after{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:3px;background:var(--hi-ink);border-radius:2px}
.chart td.circle::before{content:"";position:absolute;inset:4px;border:3px solid var(--ink);border-radius:50%}
.chart td.slide{background:#EEF2F7}
.chart td.pad{color:#9AA5B3}
.chart.compact{margin:8px 0 0}
.chart.compact th span{height:0;display:none}
.chart.compact th{padding:0;height:0}
.chart-label{font-size:12px;color:var(--graphite);text-align:center;margin-top:6px;font-weight:600}
pre.stack{font-family:Menlo,Consolas,"Courier New",monospace;font-size:22px;font-weight:700;line-height:1.35;margin:10px auto 4px;display:table;text-align:right;background:#F7F9FC;border:2px solid var(--line);border-radius:10px;padding:10px 18px;font-variant-numeric:tabular-nums}
pre.stack .rule{display:block;border-top:3px solid var(--ink);margin-top:2px;padding-top:2px}
pre.stack .pad{color:#9AA5B3}
pre.stack .carry{font-size:.6em;color:var(--hi-ink);vertical-align:top}

/* feedback */
.banner{border-radius:12px;padding:12px 14px;margin-top:14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:var(--ok-bg);color:#1D6B47;border:2px solid var(--ok)}
.banner.no{background:var(--no-bg);color:#8A2E27;border:2px solid var(--no)}
.banner .mark{font-size:22px;line-height:1}
.banner small{display:block;font-weight:500;margin-top:3px}
.banner .lvl{display:block;margin-top:6px;font-weight:800}

/* walkthrough */
.wt{margin-top:14px}
.step{background:#fff;border-left:5px solid var(--hi);padding:12px 14px;border-radius:0 12px 12px 0;margin:10px 0;font-size:17px}
.step.dim{opacity:.55;border-left-color:var(--line)}
.step .n{display:inline-block;font-weight:800;color:var(--hi-ink);margin-right:6px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 0}
.progress i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.pill{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--graphite)}
.streak{font-size:14px;color:var(--graphite)}

/* grown-ups */
table.report{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.report th,table.report td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.report th{font-size:12px;color:var(--graphite);text-transform:uppercase;letter-spacing:.04em}
.miss{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.miss .q{font-weight:700}
.miss .meta{font-size:12px;color:var(--graphite)}
.miss .a{margin-top:2px}
.miss .a .bad{color:var(--no);text-decoration:line-through}
.miss .a .good{color:#1D6B47;font-weight:700}
textarea.io{width:100%;min-height:90px;font-family:Menlo,Consolas,monospace;font-size:12px;border:2px solid var(--line);border-radius:10px;padding:8px}
.profile{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin:8px 0}
.profile .pname{font-weight:700;font-size:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.chart td{width:32px;height:40px;font-size:20px}}

/* v2 additions: learning loop, a11y, save warning */
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.warn{background:#FFF4D6;border:2px solid #E0B84A;color:#6B5A00;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px;font-weight:600}
.substep{margin-top:12px;padding:12px 14px;border:2px dashed var(--line);border-radius:12px;background:#F7F9FC;font-size:16px;color:var(--ink)}
.substep .cq{font-weight:600;margin-bottom:8px}

.tags .tag,table.report .tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;color:var(--graphite);background:#fff;line-height:1.6}

input.ans.text{font-size:24px;font-variant-numeric:normal}

<body>
<div class="app" id="app"></div>
<script>
// ===== Number words =====
const ONES = ["", "one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["", "", "twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function words(n){
  n = Math.floor(n);
  if(n===0) return "zero";
  if(n<20) return ONES[n];
  if(n<100) return TENS[Math.floor(n/10)] + (n%10 ? "-"+ONES[n%10] : "");
  if(n<1000) return ONES[Math.floor(n/100)]+" hundred"+(n%100 ? " "+words(n%100) : "");
  if(n<1e6) return words(Math.floor(n/1000))+" thousand"+(n%1000 ? " "+words(n%1000) : "");
  return words(Math.floor(n/1e6))+" million"+(n%1e6 ? " "+words(n%1e6) : "");
}
const DEC_PLACES = ["tenths","hundredths","thousandths"];
const WHOLE_PLACES = ["ones","tens","hundreds","thousands","ten thousands","hundred thousands","millions","ten millions","hundred millions"];
const DEC_FRACTION = ["1/10","1/100","1/1000"];
const WHOLE_VALUE = ["1","10","100","1,000","10,000","100,000","1,000,000","10,000,000","100,000,000"];
const WHOLE_SING=["one","ten","hundred","thousand","ten thousand","hundred thousand","million","ten million","hundred million"];
const DEC_SING=["tenth","hundredth","thousandth"];
const MAX_LEVEL=5;

// A decimal number is {w: integer whole, d: string of decimal digits ("" allowed; trailing zeros kept if present)}
function fmt(num){ const w = num.w.toLocaleString("en-US"); return num.d ? w+"."+num.d : w; }
function numValue(num){ return parseFloat(num.w+"."+(num.d||"0")); }
function toWordForm(num){
  const parts=[];
  if(num.w>0) parts.push(words(num.w));
  if(num.d){
    const di = parseInt(num.d,10);
    const dw = words(di)+" "+DEC_PLACES[num.d.length-1];
    if(num.w>0) parts.push("and "+dw); else parts.push(dw);
  }
  if(!parts.length) return "zero";
  return parts.join(" ");
}
function trimDec(d){ return d.replace(/0+$/,""); }
function fromThousandths(V){ const w=Math.floor(V/1000); const d=String(V%1000).padStart(3,"0"); return {w, d: trimDec(d)}; }
function fixedFrom(V, places){ const w=Math.floor(V/1000); const d=String(V%1000).padStart(3,"0").slice(0,places); return {w,d}; }
function padTo(num,k){ return {w:num.w, d:(num.d||"").padEnd(k,"0")}; }
function toThousandths(num){ return num.w*1000 + parseInt((num.d||"").padEnd(3,"0"),10); }
function plural(n,s){ return n+" "+s+(n===1?"":"s"); }
function near(a,b){ return Math.abs(a-b)<1e-9; }

// ===== random helpers =====
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = arr=>arr[ri(0,arr.length-1)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }
function nonZeroDigits(k){ let s=""; for(let i=0;i<k;i++) s+=ri(1,9); return s; }
function digitsNoTrail(k){ if(k<=0) return ""; let s=""; for(let i=0;i<k-1;i++) s+=ri(0,9); return s+ri(1,9); }
function digitsWithLeadingZeros(k, z){ let s=""; for(let i=0;i<z;i++) s+="0"; s+=ri(1,9); for(let i=z+1;i<k;i++) s+=ri(0,9);
  if(s.endsWith("0")) s=s.slice(0,-1)+ri(1,9); return s; }

// ===== Checks (interactive substeps) =====
const ci=(q,answer,display)=>({q, type:"input", answer, display: display!==undefined ? String(display) : String(answer)});
const cm=(q,options,answer)=>({q, type:"mc", options, answer, display:options[answer]});
// options with tags, de-duplicated by text, correct always kept
function buildOptions(correct, distractors){ // distractors: [{text, tag}]
  const seen=new Set([correct]); const list=[{text:correct, tag:"correct"}];
  for(const d of distractors){ if(d.text && !seen.has(d.text)){ seen.add(d.text); list.push(d); } if(list.length>=4) break; }
  const sh=shuffle(list);
  return {options:sh.map(o=>o.text), optionTags:sh.map(o=>o.tag), answer:sh.findIndex(o=>o.tag==="correct")};
}
function finalCheck(p){ // the last walkthrough step asks for the whole answer
  return p.type==="input" ? ci(`Now you finish it. Type the answer.`, p.answer, p.display) : cm(`Now you finish it. Pick the answer.`, p.options, p.answer);
}

// ===== Chart model =====
function chartModel(num, minWholeCols=1){
  const ws = String(num.w);
  const cols = Math.min(WHOLE_PLACES.length, Math.max(ws.length, minWholeCols));
  const whole=[];
  for(let i=cols-1;i>=0;i--){ const idx = ws.length-1-i; whole.push({place:WHOLE_PLACES[i], digit: idx>=0 ? ws[idx] : "", key:"w"+i}); }
  const dec=[];
  for(let i=0;i<3;i++) dec.push({place:DEC_PLACES[i], digit: (num.d && num.d[i]) || "", key:"d"+(i+1)});
  return {whole, dec};
}

// ===== Generators =====
// Each returns {skill, level, prompt, type, answer, options?, optionTags?, display, steps:[{t, chart?, charts?, hl?, minCols?, check?}], hints:[...], show, minCols?, meta}
// `focus` (optional) = {tag, ...} from focusFor(): steer the variant toward the mistake just made.

function genStandard(level, focus){
  const f=focus&&focus.tag;
  let w, d;
  if(level===1){ w=ri(1,9); d=nonZeroDigits(ri(1,2)); }
  else if(level===2){ w=ri(1,99); d=nonZeroDigits(3); }
  else if(level===3){ w=ri(1,99); d=digitsWithLeadingZeros(ri(2,3), 1); }
  else if(level===4){ const zeros=ri(1,2); const k=Math.max(zeros+1, ri(2,3)); w = Math.random()<0.5 ? 0 : ri(1,999); d=digitsWithLeadingZeros(k, zeros); }
  else { w=pick([0, ri(1,99), ri(100,999), ri(1000,9999)]); const z=ri(0,2); d = z ? digitsWithLeadingZeros(3,z) : nonZeroDigits(ri(1,3)); }
  if(f==="zeros"){ const k=Math.max(2,d.length); d=digitsWithLeadingZeros(k, ri(1,k-1)); }           // zeros after the dot were the problem
  if(f==="whole" && w===0) w=ri(1,99);                                                                   // whole part was the problem
  if(f==="no-whole") w=0;
  const num={w,d};
  const wf=toWordForm(num);
  const k=d.length, di=parseInt(d,10), dgs=String(di).length, place=DEC_PLACES[k-1];
  const steps=[];
  if(w>0) steps.push({t:`Find the word <b>and</b>. That is the decimal point. Everything before it is the whole number.`, check:ci(`What is the whole number?`, w, w.toLocaleString("en-US"))});
  else steps.push({t:`There is no word <b>and</b> in this problem. That means there is <b>no whole number</b>. A 0 will hold the ones seat.`, check:cm(`What goes in front of the dot?`, ["0","Nothing, start with the dot","The first word"], 0)});
  steps.push({t:`The last word is <b>${place}</b>. So the last digit has to land in the ${place} seat.`, check:ci(`How many seats after the dot is the ${place} seat?`, k)});
  steps.push({t:`The decimal part says <b>${words(di)}</b>. As a plain number that is <b>${di}</b>, which has <b>${dgs}</b> digit${dgs>1?"s":""}.`});
  if(dgs<k) steps.push({t:`${dgs} is fewer than ${k}. Zeros go in front, between the dot and the ${di}, to push the last digit into the ${place} seat.`, check:ci(`How many zeros go right after the dot?`, k-dgs)});
  else steps.push({t:`That is exactly ${k} digit${k>1?"s":""}, so <b>no zeros are needed</b>. The number drops right in.`, check:ci(`How many zeros go right after the dot?`, 0)});
  const p={skill:"standard", level, prompt:`Write the standard form for<br><span class="big-words">${wf}</span>`, type:"input", answer:numValue(num), display:fmt(num), show:"blank", meta:{num,k,dgs}};
  steps.push({t:`Put it together: whole number, dot, ${k-dgs?plural(k-dgs,"zero")+", ":""}then ${di}.`, chart:num, check:finalCheck(p)});
  p.steps=steps;
  p.hints=[
    {t:`"And" is the dot. The last word tells you which seat the last digit lands in.`},
    w>0 ? {t:`Everything before "and" is the whole number: <b>${w.toLocaleString("en-US")}</b>. Write it, then the dot.`, chart:{w,d:""}}
        : {t:`No "and" means no whole number. Start with <b>0</b> and the dot.`, chart:{w:0,d:""}},
    {t:`The last word is <b>${place}</b>, so the last digit must sit ${k} seat${k>1?"s":""} after the dot. If <b>${words(di)}</b> has fewer than ${k} digits, zeros fill the gap right after the dot.`}
  ];
  return p;
}

function genWords(level, focus){
  const f=focus&&focus.tag;
  let w, d;
  if(level===1){ w=ri(1,20); d=nonZeroDigits(ri(1,2)); }
  else if(level===2){ w=ri(10,99); d=nonZeroDigits(3); }
  else if(level===3){ w=ri(1,99); d=digitsWithLeadingZeros(3,1); }
  else if(level===4){ w=ri(100,999); d=digitsWithLeadingZeros(3, ri(1,2)); }
  else { w=ri(100,9999); d=pick([nonZeroDigits(ri(1,3)), digitsWithLeadingZeros(3,1), digitsWithLeadingZeros(3,2)]); }
  if(f==="leading-zero") d=digitsWithLeadingZeros(3, ri(1,2));
  if(f==="place-name" && d.length<2) d=nonZeroDigits(ri(2,3));
  const num={w,d}; const correct=toWordForm(num);
  const k=d.length, di=parseInt(d,10);
  const D=[];
  if(k>1) D.push({text:words(w)+" and "+words(di)+" "+DEC_PLACES[k-2], tag:"place-name"});
  if(d[0]==="0") D.push({text:words(w)+" and "+words(di)+" "+DEC_PLACES[String(di).length-1], tag:"leading-zero"});
  if(k<3) D.push({text:words(w)+" and "+words(di)+" "+DEC_PLACES[k], tag:"place-name"});
  if(d.length>=2){ const twoDigit=parseInt(d.slice(0,2),10); if(twoDigit!==di && twoDigit>0) D.push({text:words(w)+" and "+words(twoDigit)+" "+DEC_PLACES[k-1], tag:"dropped-digit"}); }
  D.push({text:words(w)+" and "+words(di)+" "+DEC_PLACES[(k+1)%3], tag:"place-name"});
  D.push({text:words(w)+" and "+words(di), tag:"missing-place"});
  D.push({text:words(w+1)+" and "+words(di)+" "+DEC_PLACES[k-1], tag:"whole"});
  const o=buildOptions(correct, D);
  const hl={}; for(let i=1;i<=k;i++) hl["d"+i]="ul";
  const p={skill:"words", level, prompt:`Which is the word form for<br><span class="big-num">${fmt(num)}</span>`, type:"mc", options:o.options, optionTags:o.optionTags, answer:o.answer, display:correct, show:num, meta:{num,k}};
  p.steps=[
    {t:`Split at the decimal point. Whole part: <b>${w.toLocaleString("en-US")}</b>. Decimal part: <b>${d}</b>.`, chart:num},
    {t:`Whole part in words: <b>${words(w)}</b>. The dot becomes the word <b>and</b>.`},
    {t:`Count the digits after the dot. Every digit counts, including a zero in front.`, chart:num, hl, check:ci(`How many digits are after the dot?`, k)},
    {t:`${k} digit${k>1?"s":""} after the dot means the last digit is sitting in the <b>${DEC_PLACES[k-1]}</b> seat.`, check:cm(`So the name at the end is…`, DEC_PLACES.slice(), k-1)},
    {t:`Read the decimal digits like a normal number: ${d} is <b>${words(di)}</b>.${d[0]==="0"?" The zero in front is silent, but it still counts as a digit, so it still pushes the name out to "+DEC_PLACES[k-1]+".":""}`, check:finalCheck(p)}
  ];
  p.hints=[
    {t:`Count the digits after the dot. That count is the name.`},
    {t:`Whole part: <b>${words(w)}</b>. The dot is the word "and".`},
    {t:`There ${k>1?"are":"is"} <b>${k}</b> digit${k>1?"s":""} after the dot, so the name is <b>${DEC_PLACES[k-1]}</b>. A leading zero still counts as a digit.`, chart:num, hl}
  ];
  return p;
}

function termFor(digit, key){
  if(key[0]==="w"){ const i=+key[1]; return i===0 ? `(${digit} × 1)` : `(${digit} × ${WHOLE_VALUE[i]})`; }
  const i=+key[1]; return `[${digit} × ${DEC_FRACTION[i-1]}]`;
}
function expandedFor(num){
  const m=chartModel(num); const terms=[];
  m.whole.forEach(c=>{ if(c.digit && c.digit!=="0") terms.push(termFor(c.digit,c.key)); });
  m.dec.forEach(c=>{ if(c.digit && c.digit!=="0") terms.push(termFor(c.digit,c.key)); });
  return terms.join(" + ");
}
function genExpanded(level, focus){
  const f=focus&&focus.tag;
  let w,d;
  if(level===1){ w=ri(1,9); d=nonZeroDigits(2); }
  else if(level===2){ w=ri(10,99); d=nonZeroDigits(3); }
  else if(level===3){ w=ri(1,99); d=digitsWithLeadingZeros(3,1); }
  else if(level===4){ w=pick([ri(100,999), 100*ri(1,9)+ri(1,9), 100*ri(1,9)+10*ri(1,9)]); d=digitsWithLeadingZeros(3, ri(1,2)); }
  else { w=pick([ri(1000,9999), 1000*ri(1,9)+ri(1,9), 1000*ri(1,9)+10*ri(1,9), 1000*ri(1,9)+100*ri(1,9)]); d=pick([nonZeroDigits(3), digitsWithLeadingZeros(3,1), digitsWithLeadingZeros(3,2)]); }
  if(f==="skip-zero") d=digitsWithLeadingZeros(3, ri(1,2));
  const num={w,d}; const correct=expandedFor(num);
  const m=chartModel(num);
  const all=[...m.whole,...m.dec].filter(c=>c.digit!=="");
  const nz=all.filter(c=>c.digit!=="0");
  const D=[];
  const dz=d.replace(/0/g,""); if(dz!==d) D.push({text:expandedFor({w, d:dz}), tag:"skip-zero"});
  const dec=nz.filter(c=>c.key[0]==="d");
  if(dec.length){ const c=dec[dec.length-1]; const i=+c.key[1]; const nk="d"+(i===3?2:i+1);
    D.push({text:nz.map(x=>x===c?termFor(x.digit,nk):termFor(x.digit,x.key)).join(" + "), tag:"shift"}); }
  if(nz.length>1) D.push({text:nz.slice(0,-1).map(c=>termFor(c.digit,c.key)).join(" + "), tag:"missing-piece"});
  const wh=nz.filter(c=>c.key[0]==="w"); if(wh.length){ const c=wh[0]; const i=+c.key[1]; const nk="w"+(i===0?1:i-1);
    D.push({text:nz.map(x=>x===c?termFor(x.digit,nk):termFor(x.digit,x.key)).join(" + "), tag:"whole-value"}); }
  D.push({text:nz.map(c=>c.key[0]==="d"?termFor(c.digit,"w"+(+c.key[1]-1)):termFor(c.digit,c.key)).join(" + "), tag:"dec-as-whole"});
  const o=buildOptions(correct, D);
  const z=all.find(c=>c.digit==="0");
  const p={skill:"expanded", level, prompt:`Which is the expanded form of<br><span class="big-num">${fmt(num)}</span>`, type:"mc", options:o.options, optionTags:o.optionTags, answer:o.answer, display:correct, show:num, meta:{num}};
  const valOf=c=> c.key[0]==="w" ? WHOLE_VALUE[+c.key[1]] : DEC_FRACTION[+c.key[1]-1];
  const steps=[{t:`Find every digit that is <b>not</b> zero: ${nz.map(c=>"<b>"+c.digit+"</b>").join(", ")}. One piece for each.`, chart:num, check:ci(`How many pieces will the answer have?`, nz.length)}];
  const allVals=[...WHOLE_VALUE.slice(0,4), ...DEC_FRACTION];
  nz.forEach((c,i)=>{ const val=valOf(c);
    const idx=allVals.indexOf(val); const cand=[val]; for(let dlt=1; cand.length<4 && dlt<7; dlt++){ if(allVals[idx-dlt]) cand.push(allVals[idx-dlt]); if(cand.length<4 && allVals[idx+dlt]) cand.push(allVals[idx+dlt]); }
    const opts=shuffle(cand);
    steps.push({t:`The <b>${c.digit}</b> is in the <b>${c.place}</b> seat.`, chart:num, hl:{[c.key]:"ul"}, check: i<2 ? cm(`So the ${c.digit} is worth ${c.digit} × …?`, opts, opts.indexOf(val)) : undefined}); });
  if(z) steps.push({t:`Zeros get <b>no piece</b>, but they still <b>hold their seat</b>. Skip the zero, do not slide the next digit over into its seat.`, check:cm(`What does a 0 in the ${z.place} seat get?`, ["No piece, but it holds the seat","A piece: 0 × "+valOf(z),"It gets skipped and the next digit slides over"], 0)});
  steps.push({t:`Line up the pieces with plus signs. Count them: there should be ${nz.length}.`, check:finalCheck(p)});
  p.steps=steps;
  const fc=nz[0];
  p.hints=[
    {t:`One piece for every digit that is not a zero.`},
    {t:`Count the digits that are not zero: there are <b>${nz.length}</b>. So the answer has exactly ${plural(nz.length,"piece")}.`},
    {t:`The seat names the piece. The <b>${fc.digit}</b> sits in the <b>${fc.place}</b> seat, so its piece is <b>${fc.digit} × ${valOf(fc)}</b>. Do the same for each digit.`, chart:num, hl:{[fc.key]:"ul"}}
  ];
  return p;
}

function genShift(level, focus){
  const f=focus&&focus.tag;
  // 1) decide the operation and the factor (focus wins so the follow-up matches the miss)
  let op, factor;
  if(level===1){ op=pick(["×","÷"]); factor=10; }
  else if(level===2){ op=pick(["×","÷"]); factor=pick([10,100]); }
  else if(level===3){ op=pick(["×","÷"]); factor=pick([10,100]); }
  else if(level===4){ op="÷"; factor=pick([10,100]); }
  else { op=pick(["×","÷"]); factor=pick([10,100,1000]); }
  if(focus && focus.op) op=focus.op;
  if(focus && focus.factor && (f==="count"||f==="direction")) factor=focus.factor;
  const n=Math.round(Math.log10(factor));
  // 2) build a number whose result still fits in the chart (at most 3 decimal places). For ÷ that means
  //    the number may have at most 3-n decimal digits; we regenerate until V is exactly divisible.
  let num, V, tries=0;
  do{
    if(level<=2) num={w:ri(11,99), d:""};
    else if(level===3) num={w:ri(1,9), d:String(ri(1,9))};

// ===== Progression =====
// hist: last few INDEPENDENT results for a skill (1 = right, 0 = wrong). Returns +1 (level up), -1 (level down), or 0.
function applyResult(hist, level, ok){
  hist.push(ok?1:0); while(hist.length>6) hist.shift();
  const last4=hist.slice(-4), last3=hist.slice(-3);
  if(ok && last4.length>=3 && last4.filter(x=>x).length>=3 && level<MAX_LEVEL) return {level:level+1, hist:[], change:+1};
  if(!ok && last3.filter(x=>!x).length>=2 && level>1) return {level:level-1, hist:[], change:-1};
  return {level, hist, change:0};
}

// ===================== Unit 2: expressions, order of operations, prime factorization, multiplication =====================

function flatTemplate(level){

function chartHTML(num, hl, minCols, compact){
  if(num==="blank"||!num) return `<div class="chart"><table>${chartHeader(3)}<tr>${"<td></td>".repeat(3)}<td class="point">•</td>${"<td></td>".repeat(3)}</tr></table></div>`;
  const m=chartModel(num, minCols||1);
  const cls=k=>{ if(!hl) return ""; if(hl==="all") return " slide"; return hl[k]?(" "+hl[k]):""; };
  const cells=m.whole.map(c=>`<td class="${cls(c.key)}">${c.digit}</td>`).join("")+`<td class="point">•</td>`+m.dec.map(c=>`<td class="${cls(c.key)}">${c.digit}</td>`).join("");
  return `<div class="chart${compact?" compact":""}"><table>${compact?"":chartHeader(m.whole.length, m.whole.map(c=>c.place))}<tr>${cells}</tr></table></div>`;
}
// Header laid out like the classroom chart: a dark period band (THOUSANDS | ONES | DECIMALS), then fraction labels
// over the decimal seats with "Decimal Point" standing in the dot column, then the vertical place names.
const PERIODS=["ONES","THOUSANDS","MILLIONS","BILLIONS"];
function chartHeader(nWhole, places){
  places = places || WHOLE_PLACES.slice(0,nWhole).reverse();
  const fracs = typeof DEC_FRACTION!=="undefined" ? DEC_FRACTION : ["1/10","1/100","1/1000"];
  const groups=[]; // period label + how many of its columns are present, in display order (left to right)
  for(const p of places){ const idx=WHOLE_PLACES.indexOf(p); const label=PERIODS[Math.floor(Math.max(0,idx)/3)]||"";
    const g=groups[groups.length-1]; if(g && g.label===label) g.span++; else groups.push({label, span:1}); }
  const period=`<tr class="period">${groups.map(g=>`<th colspan="${g.span}" scope="colgroup">${g.label}</th>`).join("")}<th class="point" aria-hidden="true"></th><th colspan="${DEC_PLACES.length}" scope="colgroup">DECIMALS</th></tr>`;
  const fracCell=f=>{ const [a,b]=String(f).split("/"); return `<th><span class="frac" aria-label="${esc(a)} over ${esc(b)}"><sup>${esc(a)}</sup>/<sub>${esc(b)}</sub></span></th>`; };
  const fracRow=`<tr class="fracs">${places.map(()=>`<th></th>`).join("")}<th class="point" rowspan="2"><span>Decimal Point</span></th>${DEC_PLACES.map((_,i)=>fracCell(fracs[i]||"")).join("")}</tr>`;
  const names=`<tr class="names">${places.map(p=>`<th><span>${cap(p)}</span></th>`).join("")}${DEC_PLACES.map(p=>`<th><span>${cap(p)}</span></th>`).join("")}</tr>`;
  return period+fracRow+names;
}
function chartsHTML(s){ // a step or hint may carry one chart or several
  if(s.charts){ return s.charts.map((n,i)=>chartHTML(n, s.hl, s.minCols, i>0)).join(""); }
  return s.chart ? chartHTML(s.chart, s.hl, s.minCols) : "";
}

const optsHTML=(id, options, sel, answer, done, cls, mark)=>{ // MC radiogroup. done => show right/wrong and disable. mark => this option shows as right while still enabled

function drawWeighted(keys, weights){
  let r=Math.random()*weights.reduce((a,b)=>a+b,0);
  for(let i=0;i<weights.length;i++){ r-=weights[i]; if(r<=0) return keys[i]; }
  return keys[0];
}
function weekWeights(){ // current lesson's skills ×3, the two lessons before it ×1 each; skills the app lacks are skipped
  const L=lessonList(), ci=lessonIdx(S.classAt); const w={};
  if(ci<0) return w;
  [[ci,3],[ci-1,1],[ci-2,1]].forEach(([i,wt])=>{ if(i>=0) for(const k of lessonSkills(L[i])) w[k]=(w[k]||0)+wt; });
  return w;
}
function pickSkill(){
  if(mode==="week"){ const w=weekWeights(), keys=Object.keys(w); if(keys.length) return drawWeighted(keys, keys.map(k=>w[k])); }
  else if(mode!=="mix") return mode;
  return drawWeighted(SKILL_ORDER, SKILL_ORDER.map(k=>(MAX_LEVEL+1-S.levels[k])*2+1)); // mix (and week with nothing to draw from)
}
function resetProblemState(){ // everything that must not leak from one problem into the next
  phase="q"; stepIdx=0; selected=-1; lastAnswer=""; hintIdx=0; lastChange=0; inlineErr="";
  sc=null; stepRes=[]; revealed=0; passed=0; missEntry=null;
}
function start(m){ mode=m; next(); }
function next(){ // a fresh problem: new help chain
  const sk=pickSkill();
  stage="fresh"; chain=0;
  cur=SKILLS[sk].gen(S.levels[sk]); resetProblemState(); render();
}
function followup(){ // "Try one like it": same skill, same level as the one she missed, aimed at the same mistake
  const prev=cur, sk=prev.skill, tag=prev.mistake?prev.mistake.tag:"other";
  let focus; try{ focus = typeof focusFor==="function" ? focusFor(prev, tag) : undefined; }catch(e){ focus=undefined; }
  stage="followup";
  const lvl=Math.min(MAX_LEVEL, Math.max(1, +prev.level||S.levels[sk]));
  cur=SKILLS[sk].gen(lvl, focus); cur.focusTag=tag; resetProblemState(); render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function initStepCheck(){ const s=cur.steps[stepIdx]; sc = s&&s.check ? {tries:0, state:"open", val:"", sel:-1, msg:""} : null; }
const scActive=()=>!!sc && (sc.state==="open"||sc.state==="confirm"); // the check still wants an entry
// Substep acceptance: the engine's checkAccepts handles answer / accept[] / text / validate; the local version is the numeric fallback
function stepAccepts(c,str){
  if(typeof checkAccepts==="function") return !!checkAccepts(c,str);
  if(c.text===true) return String(str).trim().replace(/\s+/g," ").toLowerCase()===String(c.display).trim().replace(/\s+/g," ").toLowerCase();
  const n=parseAnswer(str); if(isNaN(n)) return false;
  return Math.abs(n-c.answer)<1e-9 || (Array.isArray(c.accept) && c.accept.some(a=>Math.abs(n-a)<1e-9));
}
// Input problems: "" when the entry is worth checking, else a message to show instead of counting an attempt
function issueFor(target,str){
  if(typeof inputIssue==="function"){ try{ const m=inputIssue(target,str); return m?String(m):""; }catch(e){} }
  if(target.text===true||typeof target.validate==="function") return String(str).trim()?"":"Type an answer first.";
  return isNaN(parseAnswer(str)) ? "Type a number, like 72.585" : "";
}
const isTextTarget=t=>!!t && t.text===true;
const ansAttrs=t=>isTextTarget(t) ? `inputmode="text" autocapitalize="off" spellcheck="false"` : `inputmode="decimal"`;

function render(){

    <div class="topbar"><button class="btn quiet" id="back">Home</button>

      else if(stage==="fresh") msg=`You got it with a hint.<small>Level-ups come from problems you do on your own, so the next one is fresh, no hints needed yet.</small>`;

        <div class="actions">${done?`<button class="btn primary" id="next">Next</button>`:""}</div>`;
    }

    else body+=optsHTML("opts", cur.options, selected, -1, true, "opt");
    const head = chain>=2 ? "Still not there. One more walk through, then another try." : "Not yet. Let's walk through it.";
    right=`<div class="banner no" style="margin-top:0" role="status" aria-live="polite"><span class="mark" aria-hidden="true">✕</span><div>${head}${noteHTML}<small>Step ${stepIdx+1} of ${total}</small>${downHTML}</div></div>
      <div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${stepIdx+1}" aria-label="Walkthrough progress"><i style="width:${Math.round(100*(stepIdx+1)/total)}%"></i></div>
      <div class="wt" id="wt">${cur.steps.slice(0,stepIdx+1).map((s,i)=>stepHTML(s,i,i<stepIdx,true)).join("")}</div>
      <div class="actions">${open?"":(!last?`<button class="btn primary" id="step">Next step</button>`:`<button class="btn primary" id="retry">Try one like it</button>`)}</div>`;
  }
  const card = right ? `<div class="card two"><div class="left">${body}</div><div class="right">${right}</div></div>` : `<div class="card">${body}</div>`;
  app.innerHTML=top+card+`<p class="streak" style="margin-top:12px">${S.today.c} right today${S.run>=2?` · ${S.run} in a row`:""}</p>`;
  bind();
}
function stepHTML(s,i,dim,withCheck){
  let sub="";
  if(withCheck && s.check){
    const c=s.check;
    if(i<stepIdx){ // an earlier step: show how its check went
      const r=stepRes[i];
      sub=`<div class="substep ${r==="ok"?"ok":"bad"}">${c.q}<div class="res"><span aria-hidden="true">${r==="ok"?"✓":"•"}</span> ${r==="ok"?`You got <b>${esc(c.display)}</b>.`:`It's <b>${esc(c.display)}</b>.`}</div></div>`;
    } else if(sc){
      const open=scActive();
      sub=`<div class="substep ${sc.state==="ok"?"ok":sc.state==="revealed"?"bad":sc.state==="confirm"?"confirm":""}"><div class="cq">${c.q}</div>${checkCtlHTML(c)}
        <div class="inline-msg" id="cmsg" role="status" aria-live="polite">${sc.msg}</div>

function checkCtlHTML(c){ // the entry control for a check, driven by sc. In confirm state it stays enabled with the right answer marked

  return `<label class="vh" for="cans">Your answer for this step</label><input class="ans small${isTextTarget(c)?" text":""}" id="cans" ${ansAttrs(c)} autocomplete="off" placeholder="${isTextTarget(c)?"Type your answer (like 2 × 2 × 3)":"Your answer"}" ${open?"":"disabled"} value="${esc(open?sc.val:c.display)}">`;

function focusFirst(){

  }
  if(q("next")) q("next").onclick=next;
  if(q("step")) q("step").onclick=()=>{ stepIdx++; initStepCheck(); render(); const st=app.querySelectorAll("#wt .step"); if(st.length) st[st.length-1].scrollIntoView({behavior:"smooth",block:"nearest"}); };
  if(q("retry")) q("retry").onclick=followup;
  focusFirst();
}
function setSel(groupId, i, focusIt){ // select an MC option without re-rendering
  if(groupId==="opts") selected=i; else if(sc) sc.sel=i;
  app.querySelectorAll("#"+groupId+" .opt").forEach(x=>{ const on=+x.dataset.i===i; x.classList.toggle("sel",on); x.setAttribute("aria-checked",on); if(on&&focusIt) x.focus({preventScroll:true}); });
}
function activeGroup(){ // the MC radiogroup the keyboard should drive right now, if any
  if(phase==="q"&&cur.type==="mc") return {id:"opts", n:cur.options.length, get:()=>selected};
  if((phase==="wt"||phase==="reveal")&&scActive()&&cur.steps[stepIdx].check.type==="mc") return {id:"copts", n:(cur.steps[stepIdx].check.options||[]).length, get:()=>sc.sel};
  return null;
}
app.addEventListener("keydown", e=>{ // keyboard for the practice screen: Enter checks, 1-4 / a-d pick, arrows move
  if(!cur) return;
  const tg=e.target, tag=tg.tagName, isOpt=tg.classList&&tg.classList.contains("opt");
  if(tag==="TEXTAREA"||e.altKey||e.ctrlKey||e.metaKey) return;
  const g=activeGroup();
  if(e.key==="Enter"){
    if(tag==="BUTTON"&&!isOpt) return; // let ordinary buttons click natively
    e.preventDefault();
    if(isOpt&&g&&g.get()<0){ setSel(g.id,+tg.dataset.i); return; }
    if(phase==="q") submit(); else if((phase==="wt"||phase==="reveal")&&scActive()) checkStep();
    return;
  }
  if(tag==="INPUT"||!g) return;
  const k=e.key.toLowerCase(); let idx=-1;
  if(/^[1-4]$/.test(k)) idx=+k-1;
  else if(/^[a-d]$/.test(k)) idx="abcd".indexOf(k);
  else if(k==="arrowdown"||k==="arrowright") idx=(g.get()+1)%g.n;
  else if(k==="arrowup"||k==="arrowleft") idx=(g.get()-1+g.n)%g.n;
  else return;
  if(idx>=g.n) return;
  e.preventDefault(); setSel(g.id, idx, k.startsWith("arrow")||isOpt);
});

function pushLog(e){
  S.log.push(e);
  while(S.log.length>LOG_CAP){ S.log.shift(); S.logTrimmed=(S.logTrimmed||0)+1; }
  return e;
}
function diag(yours){ try{ return (typeof diagnose==="function" && diagnose(cur, yours)) || {tag:"other", note:""}; }catch(e){ return {tag:"other", note:""}; } }
function submit(){
  let ok, yours, raw;
  if(cur.type==="input"){ const inp=app.querySelector("#ans"); const v=inp.value; lastAnswer=v; if(!v.trim()){ inp.focus(); return; }
    const issue=issueFor(cur,v); if(issue){ inlineErr=issue; render(); return; } // not a countable attempt yet
    ok=!!checkInput(cur,v); yours=v.trim(); raw=v; }
  else { if(selected<0){ inlineErr=""; const f=app.querySelector("#opts .opt"); if(f) f.focus(); return; } ok=(selected===cur.answer); yours=cur.options[selected]; raw=selected; }
  inlineErr="";
  const sk=cur.skill; S=normalize(S); S.attempted++; S.today.a++;
  // Only independent attempts (fresh, no hints) move levels, up or down. Hints, follow-ups, walkthroughs never do.
  const independent = stage==="fresh" && hintIdx===0;
  const entry={t:Date.now(), sk, lvl:cur.level, q:plain(cur.prompt), yours:String(yours), ans:cur.display, ok:ok?1:0, stage, hints:hintIdx, independent:(ok&&independent)?1:0, tag: cur.mistake ? cur.mistake.tag : (cur.focusTag||"")};
  lastChange=0;
  if(independent){ const res=applyResult(S.hist[sk], S.levels[sk], ok); S.levels[sk]=res.level; S.hist[sk]=res.hist; lastChange=res.change; }
  if(ok){
    S.correct++; S.today.c++; S.run++; S.best=Math.max(S.best,S.run);
    if(!independent){ S.guided++; S.persist++; }
    pushLog(entry); phase="ok";
  } else {
    S.run=0;
    const d=diag(raw); cur.mistake=d; entry.tag=d.tag;
    if(stage==="fresh") chain=1; else chain++;
    missEntry=pushLog(entry);
    if(chain<3){ phase="wt"; stepIdx=0; stepRes=[]; revealed=0; passed=0; initStepCheck(); }
    else { phase="reveal"; S.persist=0; stepIdx=cur.steps.length-1; initStepCheck(); } // the final check is re-used so she copies the answer in
  }
  save(); render();
  if(phase!=="ok") window.scrollTo({top:0,behavior:"smooth"});
}
function checkStep(){
  const c=cur.steps[stepIdx].check; if(!scActive()) return;
  let ok;
  if(c.type==="mc"){ if(sc.sel<0){ const f=app.querySelector("#copts .opt"); if(f) f.focus(); return; } ok = sc.sel===c.answer; }
  else { const inp=app.querySelector("#cans"); const v=inp.value; sc.val=v; if(!v.trim()){ inp.focus(); return; }
    const issue=issueFor(c,v); if(issue){ sc.msg=esc(issue); render(); return; } ok = stepAccepts(c,v); }
  if(phase==="reveal"){ // copying the shown answer in: no stats, no log, it just unlocks Next
    if(ok){ sc.state="ok"; sc.msg=`<span aria-hidden="true">✓</span> That's it.`; }
    else { sc.msg = c.type==="mc" ? "Not that one. Pick the answer to continue." : "Not quite. Type the answer to continue."; sc.val=""; sc.sel=-1; }
    render(); return;
  }
  const last = stepIdx===cur.steps.length-1;
  const shown=`It's <b>${esc(c.display)}</b>.`, lockIn = c.type==="mc" ? "Tap it to lock it in." : "Type it in to lock it in.";
  if(sc.state==="confirm"){ // the answer is on screen; the step closes only once she enters it
    if(ok){ sc.state="revealed"; sc.msg=`${shown} Locked in.`; revealed++; stepRes[stepIdx]="revealed"; }
    else { sc.msg=`${shown} ${lockIn}`; sc.val=""; sc.sel=-1; }
  }
  else if(ok){ sc.state="ok"; sc.msg=`<span aria-hidden="true">✓</span> That's it.`; passed++; stepRes[stepIdx]="ok"; }
  else { sc.tries++;
    if(sc.tries<2){ sc.msg="Not quite. Try once more."; sc.val=""; sc.sel=-1; }
    else { sc.state="confirm"; sc.msg=`${shown} ${lockIn}`; sc.val=""; sc.sel=-1; } }
  if(missEntry){ missEntry.revealed=revealed; missEntry.passed=passed; }
  if(last && sc.state==="ok"){ // finished the whole problem inside the walkthrough: a guided completion
    S.guided++;
    pushLog({t:Date.now(), sk:cur.skill, lvl:cur.level, q:plain(cur.prompt), yours:c.type==="mc"?String((c.options||[])[sc.sel]):String(sc.val).trim(), ans:cur.display, ok:1, guided:1, stage:"wt", hints:hintIdx, independent:0, tag:cur.mistake?cur.mistake.tag:"", revealed, passed});
  }
  save(); render();
}

// ===== Grown-ups =====
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
const isFresh=e=>e.stage?e.stage==="fresh":!e.retry; // older entries have retry instead of stage
const indep=e=>e.independent!==undefined?e.independent:((isFresh(e)&&!e.hints)?1:0);
const fmtBytes=n=>n<1024?n+" bytes":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";
function validateBackup(text){ // returns {ok:true, db, summary} or {ok:false, err}
  let o; try{ o=JSON.parse(text); }catch(e){ return {ok:false, err:"That is not valid backup text (it did not parse as JSON). Make sure you copied all of it."}; }
  if(!o||typeof o!=="object"||Array.isArray(o)) return {ok:false, err:"The backup should be a single block of text starting with { and ending with }."};
  if(!o.profiles||typeof o.profiles!=="object"||Array.isArray(o.profiles)) return {ok:false, err:"The backup has no 'profiles' section, so it is not from this app."};
  const names=Object.keys(o.profiles); if(!names.length) return {ok:false, err:"The backup has no players in it."};
  const summary=[];
  for(const n of names){ const p=o.profiles[n];
    if(!p||typeof p!=="object") return {ok:false, err:`Player "${n}" is not a valid record.`};
    if(!p.levels||typeof p.levels!=="object"||Array.isArray(p.levels)) return {ok:false, err:`Player "${n}" has no levels.`};
    for(const k of SKILL_ORDER){ if(k in p.levels){ const v=p.levels[k]; if(typeof v!=="number"||!Number.isFinite(v)||v<1||v>MAX_LEVEL) return {ok:false, err:`Player "${n}" has an impossible level for ${SKILLS[k].name} (${String(v)}). Levels run 1 to ${MAX_LEVEL}.`}; } }
    if(p.log!==undefined && !Array.isArray(p.log)) return {ok:false, err:`Player "${n}" has a history that is not a list.`};
    if(Array.isArray(p.log)){ const bad=p.log.findIndex(e=>!e||typeof e!=="object"||Array.isArray(e)); if(bad>=0) return {ok:false, err:`Player "${n}" has a broken history entry at position ${bad}.`}; }
    const att = Array.isArray(p.log) ? p.log.length : (+p.attempted||0);
    summary.push(`${n} (${att} attempt${att===1?"":"s"})`);
  }
  return {ok:true, db:o, names, summary};
}
function grownups(){
  cur=null; S=normalize(S);
  const log=S.log.filter(e=>e&&typeof e==="object"); // normalize() already did this; belt and braces so nothing below can throw
  const str=v=>v==null?"":String(v); // a missing field shows as blank, never "undefined"
  const rows=SKILL_ORDER.map(k=>{ const a=log.filter(e=>e.sk===k);
    const ind=a.filter(e=>isFresh(e)&&!e.hints&&!e.guided).slice(-20); const indRight=ind.filter(e=>e.ok).length;
    const guided=a.filter(e=>e.ok&&indep(e)===0).length;
    const missTags=a.filter(e=>!e.ok).slice(-20).map(e=>typeof e.tag==="string"?e.tag:"").filter(Boolean);
    const cnt={}; for(const t of missTags) cnt[t]=(cnt[t]||0)+1; const topTag=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];
    return `<tr><td><b>${SKILLS[k].name}</b></td><td>${S.levels[k]} of ${MAX_LEVEL}</td><td>${ind.length?`${indRight} of ${ind.length}`:"—"}</td><td>${guided||"—"}</td><td>${topTag?`${esc(topTag)} <span class="muted">(${cnt[topTag]})</span>`:"—"}</td></tr>`; }).join("");
  const misses=log.filter(e=>!e.ok).slice(-40).reverse();
  const weekAgo=Date.now()-7*864e5; const week=log.filter(e=>Number.isFinite(e.t)&&e.t>=weekAgo&&!e.guided);
  const days=new Set(week.map(e=>new Date(e.t).toDateString())).size;
  const skillName=k=>SKILLS[k]?SKILLS[k].name:esc(str(k)||"?");
  const missMeta=e=>`${Number.isFinite(e.t)?fmtDate(e.t):"unknown time"} · ${skillName(e.sk)}${e.lvl!=null?` · level ${esc(str(e.lvl))}`:""} · ${e.stage?esc(str(e.stage)):(e.retry?"retry":"fresh")}${+e.hints>0?" · "+(+e.hints)+" hint"+(+e.hints>1?"s":""):""}${typeof e.tag==="string"&&e.tag?` · <span class="tag">${esc(e.tag)}</span>`:""}${e.revealed!==undefined?` · walkthrough: ${+e.passed||0} step${+e.passed===1?"":"s"} right, ${+e.revealed||0} shown`:""}`;
  const exportText=JSON.stringify(DB); const nPlayers=Object.keys(DB.profiles).length;
  // Class position: which lesson the class is on, set from the homework header
  const L=lessonList();
  const lessonOpt=l=>`<option value="${esc(l.id)}" ${l.id===S.classAt?"selected":""}>${esc(lessonShort(l))} · ${esc(l.name)}${l.std?` · ${esc(l.std)}`:""}${l.inferred?" (inferred)":""}</option>`;
  const skillMap=SKILL_ORDER.map(k=>{ const ids=Array.isArray(SKILLS[k].lessons)?SKILLS[k].lessons:[];
    return `<tr><td>${SKILLS[k].name}</td><td>${ids.length?ids.map(id=>`<span class="tag">${esc(lessonShortById(id))}</span>`).join(" "):"<span class=\"muted\">—</span>"}</td></tr>`; }).join("");
  const noSkill=L.filter(l=>l && !lessonSkills(l).length);
  const classHTML = L.length ? `
    <div class="card">
      <h2 style="margin-top:0">Class position</h2>
      <p class="muted" style="font-size:14px;margin:0 0 8px">Set this from the header on the homework sheet ("Homework · Unit 2 Lesson 5"). "Practice this week" on the home screen draws mostly from this lesson, with some from the two before it for spiral review.</p>
      <label class="vh" for="classat">Lesson the class is on</label>
      <div class="row"><select class="sel" id="classat">${L.map(lessonOpt).join("")}</select><button class="btn" id="saveclass">Save</button><span class="muted" id="classsaved" style="font-size:13px" role="status" aria-live="polite"></span></div>
      <h2>Which lessons each skill practices</h2>
      <div style="overflow-x:auto"><table class="report"><tr><th>Skill here</th><th>Lessons</th></tr>${skillMap}</table></div>
      ${noSkill.length?`<p class="muted" style="font-size:13px;margin:10px 0 0">Lessons with no skill in the app yet: ${noSkill.map(l=>`${esc(lessonShort(l))} · ${esc(l.name)}`).join("; ")}.</p>`:`<p class="muted" style="font-size:13px;margin:10px 0 0">Every lesson in the list has at least one skill here.</p>`}
    </div>` : "";
  const notYet = typeof NOT_YET_COVERED==="string" && NOT_YET_COVERED.trim() ? NOT_YET_COVERED : `Covered: 5.NBT.2, 5.NBT.3a, 5.NBT.3b, 5.NBT.4, and the add/subtract part of 5.NBT.7. Not yet covered from the grade-five "major" clusters: 5.NBT.1 as a stated relationship (10× / 1/10 between places), 5.NBT.5–6 (multi-digit multiplication and division), multiplying and dividing decimals (rest of 5.NBT.7), all of fractions (5.NF.1–7), and volume (5.MD.3–5). Also not covered: 5.OA, 5.MD.1–2, 5.G. Matching this to the SWUN unit and lesson sequence needs the classroom unit materials; the framework itself does not mention SWUN.`;
  app.innerHTML=`
    <div class="topbar"><button class="btn quiet" id="back">Home</button><h1 style="margin:0">${esc(S.name)}'s progress</h1><span></span></div>${warnHTML()}
    <p class="muted" style="margin:6px 0 0">Last 7 days: ${week.length} problems on ${days} day${days===1?"":"s"}, ${week.length?Math.round(100*week.filter(e=>e.ok).length/week.length)+"% right":"no data yet"}. All time: ${S.correct} of ${S.attempted}. Guided completions: ${S.guided}. Current persistence streak: ${S.persist}.</p>
    ${classHTML}
    <div class="card">
      <h2 style="margin-top:0">By skill</h2>
      <div style="overflow-x:auto"><table class="report"><tr><th>Skill</th><th>Level</th><th>On their own<br><span style="text-transform:none;letter-spacing:0">right / tried, last 20</span></th><th>Guided completions</th><th>Common mistake</th></tr>${rows}</table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Only problems done fresh with no hints move levels: up after 3 right out of the last 4, down after 2 wrong out of the last 3. Hints, follow-ups, and walkthroughs never move levels, up or down. Level ${MAX_LEVEL} mixes every trap at once. A guided completion is a problem finished with hints, inside a walkthrough, or on the follow-up.</p>
      ${S.logTrimmed>0?`<p class="muted" style="font-size:13px;margin:6px 0 0">History shows the most recent ${LOG_CAP} attempts; older entries were trimmed.</p>`:""}
    </div>
    <div class="card">
      <h2 style="margin-top:0">Recent misses</h2>
      ${misses.length?misses.map(e=>`<div class="miss"><div class="meta">${missMeta(e)}</div><div class="q">${esc(str(e.q))||"<span class=\"muted\">(question not recorded)</span>"}</div><div class="a">Answered <span class="bad">${esc(str(e.yours))||"—"}</span> · correct: <span class="good">${esc(str(e.ans))||"—"}</span></div></div>`).join(""):`<p class="muted">No misses logged yet.</p>`}
    </div>
    <div class="card">
      <h2 style="margin-top:0">Back up or move progress</h2>
      <p class="muted" style="font-size:14px;margin:0 0 8px">Progress lives only in this browser on this device. Copy this text somewhere safe (Notes, email to yourself) and paste it into the box on another device to carry everything over.</p>
      <label class="vh" for="export">Backup text</label>
      <textarea class="io" id="export" readonly>${esc(exportText)}</textarea>
      <div class="muted" style="font-size:13px;margin-top:4px">${fmtBytes(new Blob([exportText]).size)} · ${nPlayers} player${nPlayers===1?"":"s"}</div>
      <div class="actions" style="margin-top:8px"><button class="btn" id="copy">Copy backup</button><span class="muted" id="copied" style="font-size:13px" role="status" aria-live="polite"></span></div>
      <h2>Restore from a backup</h2>
      <label class="vh" for="import">Paste a backup here</label>
      <textarea class="io" id="import" placeholder="Paste a backup here"></textarea>
      <div class="inline-err" id="imperr" role="status" aria-live="polite"></div>
      <div class="actions" style="margin-top:8px"><button class="btn" id="doimport">Restore</button></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">What this app covers</h2>
      <p class="muted" style="font-size:14px;margin:0 0 8px">Mapped to the California Mathematics Framework, Grade Five (CDE), which uses the Common Core standard codes. This app is decimal place-value practice; it is not a full fifth-grade program.</p>
      <div style="overflow-x:auto"><table class="report"><tr><th>Skill here</th><th>Standard</th></tr>${SKILL_ORDER.map(k=>`<tr><td>${SKILLS[k].name}</td><td>${SKILLS[k].std}</td></tr>`).join("")}</table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">${esc(notYet)}</p>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Danger zone</h2>
      <div class="actions" style="margin-top:0"><button class="btn danger" id="reset">Reset ${esc(S.name)}'s levels</button><button class="btn danger" id="remove">Remove player ${esc(S.name)}</button></div>
    </div>`;
  const q=id=>app.querySelector("#"+id);
  q("back").onclick=home; q("back").focus({preventScroll:true});
  if(q("saveclass")) q("saveclass").onclick=()=>{ const id=q("classat").value; const l=lessonById(id);
    if(!l){ q("classsaved").textContent="Pick a lesson from the list."; return; }
    S.classAt=l.id; const okSave=save(); q("classsaved").textContent=okSave?`Saved: ${lessonShort(l)}.`:"Set for now, but this device refused to save it."; };
  q("copy").onclick=async()=>{ const ta=q("export"); ta.select(); let done=false; try{ await navigator.clipboard.writeText(ta.value); done=true; }catch(e){ try{ done=document.execCommand("copy"); }catch(e2){} } q("copied").textContent=done?"Copied.":"Select the text and copy it by hand."; };
  q("doimport").onclick=()=>{ const r=validateBackup(q("import").value); if(!r.ok){ q("imperr").textContent=r.err; return; } q("imperr").textContent="";
    if(!confirm(`Restore ${r.names.length} player${r.names.length>1?"s":""}?\n\n${r.summary.join("\n")}\n\nPlayers with the same name on this device will be replaced.`)) return;
    for(const n of r.names){ DB.profiles[n]=normalize({...r.db.profiles[n], name:n}); }
    DB.current = r.db.current && DB.profiles[r.db.current] ? r.db.current : DB.current; S=DB.profiles[DB.current]||S;
    if(!save()){ q("imperr").textContent="Restored in memory, but this device refused to save it. Progress will be lost when the page closes."; return; } home(); };
  q("reset").onclick=()=>{ if(confirm(`Erase ${S.name}'s levels and history and start from level 1?`)){ const n=S.name; S=normalize(blankProfile(n)); DB.profiles[n]=S; save(); home(); } };
  q("remove").onclick=()=>{ if(confirm(`Remove ${S.name} completely? This cannot be undone (unless you saved a backup).`)){ delete DB.profiles[S.name]; DB.current=null; S=null; save(); home(); } };
}
home();

</script>
