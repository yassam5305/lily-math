<style>
:root{
  --paper:#F5F7FA; --card:#FFFFFF; --ink:#1B2A41; --graphite:#5F6B7A; --line:#C8D1DC;
  --hi:#FFE566; --hi-ink:#6B5A00; --ok:#2F9E6B; --ok-bg:#E6F5EE; --no:#C9584F; --no-bg:#FBECEA;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{max-width:600px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
button,input,textarea{touch-action:manipulation}
.skills{display:grid;gap:10px}
.card.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.card.two .right{border-left:2px solid var(--line);padding-left:22px;min-height:100%}
@media (min-width:700px){
  .app{max-width:800px;padding-left:28px;padding-right:28px}
  h1{font-size:34px} .muted{font-size:18px}
  .skills{grid-template-columns:1fr 1fr}
  .skill{margin:0;padding:18px 18px} .skill .name{font-size:20px} .skill .blurb{font-size:15px}
  .btn{min-height:56px;font-size:18px;padding:14px 24px}
  .card{padding:26px 28px 28px}
  .prompt{font-size:22px} .big-num{font-size:48px} .big-words{font-size:30px}
  input.ans{font-size:34px;padding:14px 18px}
  .opt{font-size:19px;padding:16px 18px}
  .opts{grid-template-columns:1fr 1fr}
  .opts.long{grid-template-columns:1fr}
  .step{font-size:18px}
  .chart td{width:52px;height:56px;font-size:30px}
  .chart th{font-size:12px} .chart th span{height:88px}
  .chart td.point{font-size:34px}
  pre.stack{font-size:26px}
}
@media (min-width:1000px){
  .app{max-width:1120px}
  .card.two{grid-template-columns:5fr 6fr}
}
.spstrip{display:none}
@media (max-width:999px){ .card.two{grid-template-columns:1fr} .card.two .right{border-left:none;padding-left:0;border-top:2px solid var(--line);padding-top:16px}
  .spwrap{display:flex;gap:6px;align-items:stretch} .spwrap canvas{flex:1;min-width:0} .spstrip{display:block;width:36px;border-radius:10px;background:repeating-linear-gradient(0deg,#E6EAF1 0 8px,#F2F4F8 8px 16px)} } /* v9.12: in one column a 40px strip beside the pad stays scrollable, so a finger can always move the page */
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.01em}
h2{font-size:20px;margin:18px 0 6px}
.muted{color:var(--graphite)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:48px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,.cell:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--hi)} /* v9.12: dark ring (about 14:1) with the yellow halo; yellow alone was 1.26:1 */
.btn.primary{background:var(--ink);color:#fff}
.btn.quiet{border-color:var(--line);color:var(--graphite);font-weight:600}
.btn.small{padding:4px 10px;min-height:0;font-size:13px}
.btn.danger{border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* home */
.skill{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0;cursor:pointer}
.skill:hover{border-color:var(--ink)}
.skill .name{font-weight:700;font-size:18px}
.skill .blurb{color:var(--graphite);font-size:14px;margin-top:2px}
.dots{display:flex;gap:5px;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.dot.on{background:var(--ink)}
.dot.max{background:var(--hi-ink);border-color:var(--hi-ink)}
.mix{margin-top:14px;width:100%}
.actions .mix{flex:1 1 220px;width:auto}
.stats{margin-top:22px;font-size:14px}
.footer{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}

/* practice */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px 18px 20px;margin-top:12px}
.prompt{font-size:19px;margin:0 0 12px}
.big-num,.big-words{display:block;font-weight:800;font-size:34px;letter-spacing:.01em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.15}
.big-words{font-size:24px;font-weight:700}
sup{font-size:.6em}
input.ans{width:100%;font-size:28px;font-weight:700;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-variant-numeric:tabular-nums}
input.ans::placeholder{color:#6B7684;font-weight:500} /* v9.12: 4.6:1 */
input.ans:disabled{background:#F0F3F7;color:var(--graphite);border-color:var(--line)}
.yours{font-size:13px;color:var(--graphite);margin:10px 0 4px}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:#fff;border:2px solid #8A96A6;border-radius:12px;padding:13px 14px;font-size:16px;cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#F0F3F7}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.right::after{content:" ✓";font-weight:800;color:#1E6B47}.opt.wrong::after,.opt.crossed::after{content:" ✕";font-weight:800;color:#9E3B33} /* v9.12: not by color alone */
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hints{margin-top:12px}
.hints .step{border-left-color:var(--graphite);font-size:15px;color:var(--graphite)}
.hints .step b{color:var(--ink)}
.hints .chart td{color:var(--ink)}
.inline-err{color:#A8433B;font-size:14px;margin-top:6px;font-weight:600}

/* chart : the hero */
.chart{margin:14px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart table{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}
.chart th{font-weight:600;font-size:11px;color:var(--graphite);padding:0 3px 6px;vertical-align:bottom;line-height:1.1}
.chart th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);height:78px}
.chart td{border:2px solid var(--ink);width:38px;height:44px;text-align:center;font-size:24px;font-weight:800;background:#fff;position:relative}
.chart td.point{border:none;width:14px;background:transparent;font-size:28px;line-height:0;vertical-align:bottom;padding-bottom:6px}
.chart th.point{width:14px}
.chart td.ul{background:var(--hi)}
.chart td.ul::after{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:3px;background:var(--hi-ink);border-radius:2px}
.chart td.circle::before{content:"";position:absolute;inset:4px;border:3px solid var(--ink);border-radius:50%}
.chart td.slide{background:#EEF2F7}
.chart td.pad{color:#9AA5B3}
.chart.compact{margin:8px 0 0}
.chart.compact th span{height:0;display:none}
.chart.compact th{padding:0;height:0}
.chart-label{font-size:12px;color:var(--graphite);text-align:center;margin-top:6px;font-weight:600}
pre.stack{font-family:Menlo,Consolas,"Courier New",monospace;font-size:22px;font-weight:700;line-height:1.35;margin:10px auto 4px;display:table;text-align:right;background:#F7F9FC;border:2px solid var(--line);border-radius:10px;padding:10px 18px;font-variant-numeric:tabular-nums}
pre.stack .rule{display:block;border-top:3px solid var(--ink);margin-top:2px;padding-top:2px}
pre.stack .pad{color:#9AA5B3}
pre.stack .carry{font-size:.6em;color:var(--hi-ink);vertical-align:top}
pre.stack .cr{color:#B45309;font-weight:600}
.build{font-size:12px;margin-left:auto;align-self:center;white-space:nowrap}
.substep.why{border-style:solid;border-color:var(--ink);background:#fff}
.substep .res.after{margin-top:6px;font-weight:400;color:var(--ink);opacity:.9}
.opt.crossed{text-decoration:line-through;opacity:.45} /* a wrong pick already tried on this step */ /* what the step meant, shown only after she has answered it */
.substep.pre{border:2px solid #E9D8B5;background:#FFFBEF;border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.substep.pre .cq{margin-bottom:6px}
.scratch{margin-top:16px}
.scratch-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:14px}
.scratch canvas{display:block;width:100%;height:300px;border:2px solid var(--line);border-radius:12px;background:#FFFEF8;touch-action:none;cursor:crosshair}
.btn[aria-pressed="true"]{border-color:var(--ink);background:#EEF2F7}

/* multiplication workspace: aligned digit cells, carry boxes, an app number pad */
.ws{margin:8px 0 4px}
.ws-grid{display:inline-grid;gap:4px 3px;margin:0 auto;padding:12px 14px 12px 8px;background:#F7F9FC;border:2px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.ws-wrap{text-align:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ws .cell{width:54px;height:52px;border:2px solid var(--line);border-radius:9px;background:#fff;font-size:26px;font-weight:800;text-align:center;line-height:48px;padding:0;color:var(--ink);cursor:pointer;font-family:Menlo,Consolas,"Courier New",monospace}
.ws .cell.sel{border-color:#1762A6;background:#E9F4FF;box-shadow:0 0 0 3px #B9DCFC;position:relative;z-index:1}
/* v9.16: a small arrow in the blue box shows which way it will move after a digit; a resting box (done) is dashed with no arrow */
.ws .cell.sel.dir-l::after,.ws .cell.sel.dir-r::after{position:absolute;bottom:2px;font-size:13px;line-height:1;font-weight:800;color:#1762A6;font-family:inherit;pointer-events:none}
.ws .cell.sel.dir-l::after{content:"\2190";left:4px}
.ws .cell.sel.dir-r::after{content:"\2192";right:4px}
.ws .cell.sel.held{border-style:dashed;box-shadow:none;background:#F4F9FE}

<body>
<div class="app" id="app"></div>
<script>
// ===== Number words =====
const ONES = ["", "one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["", "", "twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function words(n){
  n = Math.floor(n);
  if(n===0) return "zero";
  if(n<20) return ONES[n];
  if(n<100) return TENS[Math.floor(n/10)] + (n%10 ? "-"+ONES[n%10] : "");
  if(n<1000) return ONES[Math.floor(n/100)]+" hundred"+(n%100 ? " "+words(n%100) : "");
  if(n<1e6) return words(Math.floor(n/1000))+" thousand"+(n%1000 ? " "+words(n%1000) : "");
  return words(Math.floor(n/1e6))+" million"+(n%1e6 ? " "+words(n%1e6) : "");
}
const DEC_PLACES = ["tenths","hundredths","thousandths"];
const WHOLE_PLACES = ["ones","tens","hundreds","thousands","ten thousands","hundred thousands","millions","ten millions","hundred millions"];
const DEC_FRACTION = ["1/10","1/100","1/1000"];
const WHOLE_VALUE = ["1","10","100","1,000","10,000","100,000","1,000,000","10,000,000","100,000,000"];
const WHOLE_SING=["one","ten","hundred","thousand","ten thousand","hundred thousand","million","ten million","hundred million"];
const DEC_SING=["tenth","hundredth","thousandth"];
const decWords=(n,idx)=>words(n)+" "+(n===1?DEC_SING:DEC_PLACES)[idx]; // "one tenth", "seven tenths"
const MAX_LEVEL=5;

// A decimal number is {w: integer whole, d: string of decimal digits ("" allowed; trailing zeros kept if present)}
function fmt(num){ const w = num.w.toLocaleString("en-US"); return num.d ? w+"."+num.d : w; }
function numValue(num){ return parseFloat(num.w+"."+(num.d||"0")); }
function toWordForm(num){
  const parts=[];
  if(num.w>0) parts.push(words(num.w));
  if(num.d){
    const di = parseInt(num.d,10);
    const dw = words(di)+" "+(di===1 ? DEC_SING : DEC_PLACES)[num.d.length-1]; // v9.12: "one tenth", not "one tenths"
    if(num.w>0) parts.push("and "+dw); else parts.push(dw);
  }
  if(!parts.length) return "zero";
  return parts.join(" ");
}
// v9.17: read number words typed from the page ("six hundred forty-seven and eight hundred ninety-two thousandths") back into {w,d}.
// It reads loosely, then accepts the result only if writing it back out gives the same words, so a typo never turns into a different number.
function wordsToInt(s){ const tk=String(s).trim().split(/[\s-]+/).filter(Boolean); if(!tk.length) return null; let total=0, part=0, any=false;
  for(const t of tk){ const o=ONES.indexOf(t), te=TENS.indexOf(t);
    if(t==="zero"){ any=true; } else if(o>0){ part+=o; any=true; } else if(te>1){ part+=te*10; any=true; }
    else if(t==="hundred"){ part=(part||1)*100; any=true; } else if(t==="thousand"){ total+=(part||1)*1000; part=0; any=true; } else return null; }
  return any ? total+part : null; }
function parseNumberWords(str){ const norm=x=>String(x).toLowerCase().replace(/[-\s]+/g," ").replace(/\ba (?=hundred|thousand)/g,"one ").replace(/\b(tenth|hundredth|thousandth)s\b/g,"$1").replace(/^zero and /,"").trim(); // "one tenths" / "six and four tenth" / "zero and three tenths" read the same as the correct form
  const s=norm(str).replace(/[.!?]+$/,"").trim(); if(!/^[a-z ]+$/.test(s)) return null;
  let w=0, d=""; const m=s.match(/^(?:(.+?) and )?(.+?) (tenth|hundredth|thousandth)$/);
  if(m){ if(m[1]){ w=wordsToInt(m[1]); if(w===null) return null; } const dv=wordsToInt(m[2]); if(dv===null) return null;
    const k=/^ten/.test(m[3])?1:/^hun/.test(m[3])?2:3; if(dv<1 || String(dv).length>k) return null; d=String(dv).padStart(k,"0"); }
  else { w=wordsToInt(s); if(w===null) return null; }
  if(w>999999) return null; const num={w,d}; return norm(toWordForm(num))===s ? num : null; }
function trimDec(d){ return d.replace(/0+$/,""); }
function fromThousandths(V){ const w=Math.floor(V/1000); const d=String(V%1000).padStart(3,"0"); return {w, d: trimDec(d)}; }
function fixedFrom(V, places){ const w=Math.floor(V/1000); const d=String(V%1000).padStart(3,"0").slice(0,places); return {w,d}; }
function padTo(num,k){ return {w:num.w, d:(num.d||"").padEnd(k,"0")}; }
function toThousandths(num){ return num.w*1000 + parseInt((num.d||"").padEnd(3,"0"),10); }
function plural(n,s){ return n+" "+s+(n===1?"":"s"); }
function near(a,b){ return Math.abs(a-b)<1e-9; }

// ===== random helpers =====
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = arr=>arr[ri(0,arr.length-1)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }
function nonZeroDigits(k){ let s=""; for(let i=0;i<k;i++) s+=ri(1,9); return s; }
function digitsNoTrail(k){ if(k<=0) return ""; let s=""; for(let i=0;i<k-1;i++) s+=ri(0,9); return s+ri(1,9); }
function digitsWithLeadingZeros(k, z){ let s=""; for(let i=0;i<z;i++) s+="0"; s+=ri(1,9); for(let i=z+1;i<k;i++) s+=ri(0,9);
  if(s.endsWith("0")) s=s.slice(0,-1)+ri(1,9); return s; }

// ===== Checks (interactive substeps) =====
const ci=(q,answer,display)=>({q, type:"input", answer, display: display!==undefined ? String(display) : String(answer)});
const cm=(q,options,answer)=>({q, type:"mc", options, answer, display:options[answer]});
const wc=(check,comp)=>{ check.comp=comp; return check; }; // tag a check with the component it tests (a string, or a function of her answer → component)
// options with tags, de-duplicated by text, correct always kept
function buildOptions(correct, distractors){ // distractors: [{text, tag}]
  const seen=new Set([correct]); const list=[{text:correct, tag:"correct"}];
  for(const d of distractors){ if(d.text && !seen.has(d.text)){ seen.add(d.text); list.push(d); } if(list.length>=4) break; }
  const sh=shuffle(list);
  return {options:sh.map(o=>o.text), optionTags:sh.map(o=>o.tag), answer:sh.findIndex(o=>o.tag==="correct")};
}
function finalCheck(p){ // the last walkthrough step asks for the whole answer
  return p.type==="input" ? ci(`Now you finish it. Type the answer.`, p.answer, p.display) : cm(`Now you finish it. Pick the answer.`, p.options, p.answer);
}

// ===== Chart model =====
function chartModel(num, minWholeCols=1){
  const ws = String(num.w);
  const cols = Math.min(WHOLE_PLACES.length, Math.max(ws.length, minWholeCols));
  const whole=[];
  for(let i=cols-1;i>=0;i--){ const idx = ws.length-1-i; whole.push({place:WHOLE_PLACES[i], digit: idx>=0 ? ws[idx] : "", key:"w"+i}); }
  const dec=[];
  for(let i=0;i<3;i++) dec.push({place:DEC_PLACES[i], digit: (num.d && num.d[i]) || "", key:"d"+(i+1)});
  return {whole, dec};
}

// ===== Generators =====
// Each returns {skill, level, prompt, type, answer, options?, optionTags?, display, steps:[{t, chart?, charts?, hl?, minCols?, check?}], hints:[...], show, minCols?, meta}
// `focus` (optional) = {tag, ...} from focusFor(): steer the variant toward the mistake just made.

function genStandard(level, focus){
  const f=focus&&focus.tag;
  let w, d;
  if(level===1){ w=ri(1,9); d=nonZeroDigits(ri(1,2)); }

function lessonTypeLabel(t){ return t==="C" ? "Concept lesson (C)" : t==="P" ? "Practice lesson (P)" : t==="MT" ? "Unit review (MT)" : String(t||""); }
function _isoToDate(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
// v9.12: MCS 2026-27 non-instruction weekdays, from the district's 2026-27 school calendar (MTA-posted copy, marked DRAFT 04/23/25).
// With these removed, every unit's school-day count equals the pacing guide's "days" (checked for all 11 units in the release tests).
const MCS_NO_SCHOOL=new Set(["2026-09-07","2026-11-11","2026-11-26","2026-11-27",
  ...["21","22","23","24","25","28","29","30","31"].map(d=>"2026-12-"+d), ...["01","04","05","06","07","08","18"].map(d=>"2027-01-"+d),
  "2027-02-08","2027-02-15", ...["22","23","24","25","26","29"].map(d=>"2027-03-"+d), "2027-05-31"]);
const _ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function _schoolDays(a,b){ let n=0; const d=new Date(a); while(d<=b){ const w=d.getDay(); if(w!==0&&w!==6&&!MCS_NO_SCHOOL.has(_ymd(d))) n++; d.setDate(d.getDate()+1); } return n; }
// Estimated lesson for a date: within a unit, spread its lessons evenly over the unit's school days; between units, sit on the previous unit's last lesson (review).
function lessonForDate(date){
  const d=new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const first=UNITS[0], last=UNITS[UNITS.length-1];
  if(d < _isoToDate(first.start)) return LESSONS.find(L=>L.unit===first.unit).id;
  for(let i=0;i<UNITS.length;i++){ const u=UNITS[i]; const st=_isoToDate(u.start), en=_isoToDate(u.end);
    const mine=LESSONS.filter(L=>L.unit===u.unit);
    if(d>=st && d<=en){ const total=Math.max(1,_schoolDays(st,en)); const done=Math.max(0,_schoolDays(st,d)-1); const idx=Math.min(mine.length-1, Math.floor(done/total*mine.length)); return mine[idx].id; }
    const nxt=UNITS[i+1]; if(d>en && (!nxt || d<_isoToDate(nxt.start))) return mine[mine.length-1].id;
  }
  const ml=LESSONS.filter(L=>L.unit===last.unit); return ml[ml.length-1].id;
}

// problem is drawn. Numbers stay inside 5.NBT.7 (decimals to hundredths) and 5.NF.1/2/4a.

// ---- decimal helpers: exact arithmetic in thousandths (integers), display through fmt ----
const D=(v)=>fromThousandths(Math.round(v)); // thousandths → {w,d}
const dV=(num)=>toThousandths(num);            // {w,d} → thousandths
const dMul=(x,y)=>Math.round(x*y/1000);        // thousandths × thousandths → thousandths
const decPlaces=num=>(num.d||"").length;
const L$d=n=>Number(n).toLocaleString("en-US");
const numFrom=(w,d)=>({w, d:String(d||"").replace(/0+$/,"")});
const fmtV=v=>fmt(D(v));
const placeWord=k=>k===0?"ones":k===1?"tenths":k===2?"hundredths":"thousandths";
const unitCount=(n,k)=>`${Number(n).toLocaleString("en-US")} ${n===1?placeWord(k).replace(/s$/,""):placeWord(k)}`; // "1 tenth", "28 tenths"

// ---- small pictures: a number line with jumps, a partitioned rectangle ----
function nlSVG(startV, jumps, endV, labelUpTo){ // jumps: [{dv, label}], values in thousandths; direction from sign of dv. labelUpTo: label landing points 0..n only (later ones show "?"), so a picture never hands over the number the step asks for
  const pts=[startV]; let v=startV; for(const j of jumps){ v+=j.dv; pts.push(v); }
  const lo=Math.min(...pts), hi=Math.max(...pts); const span=Math.max(hi-lo, 1); const W=560, H=110, x0=40, x1=W-40;
  const X=val=>x0+(val-lo)/span*(x1-x0);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:8px auto" role="img" aria-label="number line with jumps">`;
  svg+=`<line x1="${x0-20}" y1="78" x2="${x1+20}" y2="78" stroke="#1B2A41" stroke-width="2"/>`;
  pts.forEach((pv,i)=>{ const x=X(pv); const lbl = (labelUpTo===undefined || i<=labelUpTo) ? fmtV(pv) : "?"; svg+=`<line x1="${x}" y1="70" x2="${x}" y2="86" stroke="#1B2A41" stroke-width="2"/><text x="${x}" y="102" font-size="13" text-anchor="middle" fill="#1B2A41" font-weight="700">${lbl}</text>`; });
  let cur=startV; jumps.forEach((j,i)=>{ const a=X(cur), b=X(cur+j.dv); const mid=(a+b)/2; const h=28+ (i%2)*10; const dir=j.dv>=0?1:-1;
    svg+=`<path d="M ${a} 74 Q ${mid} ${74-h*1.6} ${b} 74" fill="none" stroke="#B45309" stroke-width="2.5"/><polygon points="${b},74 ${b-6*dir},66 ${b-9*dir},76" fill="#B45309"/><text x="${mid}" y="${74-h}" font-size="13" text-anchor="middle" fill="#B45309" font-weight="700">${j.label}</text>`; cur+=j.dv; });
  svg+=`</svg>`; return `<div class="chart">${svg}</div>`;
}
function areaSVG(partsA, partsB, cellText){ // partsA across the top, partsB down the side; sizes are the actual magnitudes, so the picture is a true area model. Narrow parts get a callout instead of a squeezed label.
  const W=560, left=70, top=34; const wA=partsA.map(p=>Math.max(1e-9,p.size)); const totA=wA.reduce((a,b)=>a+b,0); const hB=partsB.map(p=>Math.max(1e-9,p.size)); const totB=hB.reduce((a,b)=>a+b,0);
  const rows=Math.min(300, Math.max(90, 200*Math.min(1, totB/totA))); const H=top+rows+24; const scaleX=(W-left-20)/totA; const callouts=[]; let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:8px auto" role="img" aria-label="area model, drawn to scale">`;
  let x=left; partsA.forEach((p,i)=>{ const w=wA[i]*scaleX; const narrow=w<86; svg+=`<text x="${x+w/2}" y="22" font-size="${narrow?12:15}" text-anchor="middle" font-weight="700" fill="#1B2A41">${p.label}</text>`; let y=top; partsB.forEach((q,j)=>{ const h=hB[j]/totB*rows; const tight = narrow || h<30; svg+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${(i+j)%2?"#EEF2F7":"#FFF8D6"}" stroke="#1B2A41" stroke-width="2"/>`; if(tight){ const n=callouts.push(cellText(i,j)); svg+=`<text x="${x+w/2}" y="${y+h/2+5}" font-size="12" text-anchor="middle" fill="#B45309" font-weight="700">${n}</text>`; } else svg+=`<text x="${x+w/2}" y="${y+h/2+5}" font-size="14" text-anchor="middle" fill="#1B2A41">${cellText(i,j)}</text>`; y+=h; }); x+=w; });
  let y=top; partsB.forEach((q,j)=>{ const h=hB[j]/totB*rows; svg+=`<text x="${left-10}" y="${y+h/2+5}" font-size="${h<30?12:15}" text-anchor="end" font-weight="700" fill="#1B2A41">${q.label}</text>`; y+=h; });
  svg+=`</svg>`;
  // Slivers: any part thinner than 12px in the overview gets a magnified inset (same labels, not to scale, and it says so), so the tiny place-value pieces are inspectable.
  const thinA=partsA.map((p,i)=>({i, w:wA[i]*scaleX})).filter(o=>o.w<12), thinB=partsB.map((q,j)=>({j, h:hB[j]/totB*rows})).filter(o=>o.h<12);
  let insets="";
  if(thinA.length||thinB.length){ const cellW=150, cellH=44; const cols=thinA.length?thinA.map(o=>o.i):partsA.map((_,i)=>i); const rowsI=thinB.length?thinB.map(o=>o.j):partsB.map((_,j)=>j);
    const IW=70+cols.length*cellW+10, IH=30+rowsI.length*cellH+10; let ins=`<svg viewBox="0 0 ${IW} ${IH}" width="100%" style="max-width:${IW}px;display:block;margin:6px auto" role="img" aria-label="zoomed-in view of the thin parts, not to scale">`;

function exStepHTML(st, i, showAns){ const subOpen=!!exSub[i] && st.sub; const subBtn = st.sub && !subOpen ? `<div class="actions" style="margin-top:6px"><button class="btn quiet small exsub" data-i="${i}">Show smaller steps</button></div>` : "";
  const subList = subOpen ? `<div class="substep">${st.sub.map((x,j)=>`<div class="step"><span class="n">${i+1}${"abcdefghijklmnopqrstuvwxyz"[j]||"+"}.</span>${x.t}${x.ans!==null?` <b class="good">→ ${esc(x.ans)}</b>`:""}</div>`).join("")}</div>` : "";
  return `<div class="step exstep${showAns?"":" cur"}"><span class="n">${i+1}.</span>${st.t}${st.more?moreHTML(st.more):""}${st.vis && (showAns || !st.visAfter) ? st.vis : ""}${subList}${showAns?`${st.ans!==null?` <b class="good">→ ${esc(st.ans)}</b>`:""}${st.after?`<div class="res after">${st.after}</div>`:""}`:subBtn}</div>`; }
function exampleHTML(){ if(!exampleOpen) return ""; const ex=buildExample(); if(!ex) return `<p class="muted">No matching example is available for this exact kind of problem.</p>`;
  const n=ex.steps.length; const k=Math.max(0,Math.min(n,exStep)); const done=exAll||k>=n;
  const head=`<div class="step exhead"><span class="yourq">Your problem: <b>${esc(plain(cur.prompt))}</b></span><button class="btn quiet small" id="exback">Back to my problem</button></div><div class="step"><span class="n">Example.</span><b>${esc(ex.prompt)}</b> ${exAll?"All the steps.":"One like yours, one step at a time."}</div>`;
  let body="";
  if(exAll) body=ex.steps.map((st,i)=>exStepHTML(st,i,true)).join("");
  else { if(k>=2) body+=`<div class="step exdone muted"><span aria-hidden="true">✓</span> Step${k-1>1?`s 1–${k-1}`:" 1"} done.</div>`; if(k>=1) body+=exStepHTML(ex.steps[k-1],k-1,true);
    if(k<n){ const st=ex.steps[k]; body+=exStepHTML(st,k,false)+`<div class="actions" style="margin-top:6px"><button class="btn primary" id="exnext">${st.ans!==null?"Show this step":"Next"}</button>${st.ans!==null?`<span class="muted" style="align-self:center">Think first: what would you write?</span>`:""}</div>`; } }
  const foot = done ? `<div class="step"><span class="n">Answer.</span><b>${esc(ex.display)}</b>. Now yours: same steps, your numbers.<div class="actions" style="margin-top:8px"><button class="btn primary" id="extry">Try mine</button>${exAll?"":`<button class="btn quiet small" id="exall">See all steps</button>`}</div></div>` : `<div class="actions" style="margin-top:6px"><button class="btn quiet small" id="exall">See all steps</button></div>`;

const HW_MODES={

    blurb:"The shapes on the page: 2- and 3-digit numbers × 1- and 2-digit numbers, like 249 × 5, 32 × 13, 222 × 43, and 148 × 19.",

const hwId=m=>typeof m==="string"&&m.startsWith("hw:")?m.slice(3):null;
// v9.17: the worksheet's expression phrases (5.OA.2), read into an expression: "half of the sum of 17 and 9" → "(17 + 9) ÷ 2",
// "subtract 2 from the sum of 9 and 4" → "(9 + 4) − 2", "subtract 3 from 10, then multiply by 2" → "(10 − 3) × 2".
// Group words (sum, product, difference, quotient) and anything already built get parentheses, the way the worksheet writes them;
// "half of 20" stays bare next to + or − ("half of 20 minus 1" → "20 ÷ 2 − 1", the worksheet's reading). Returns null when it is
// not one of these phrases, or {err} when it is ambiguous or does not come out whole.
function parseExprWords(str){
  let s=String(str||"").toLowerCase().replace(/[–—‒-]/g,"−").replace(/[x*·](?=\s*[\d(])/g,"×").replace(/[.?!]+$/,"").replace(/\s+/g," ").trim();
  s=s.replace(/^(?:what is|what's|find|evaluate|solve)\s+/,"").trim();
  if(!/[a-z]/.test(s) || !/\d/.test(s)) return null;
  const NUMRE="(\\d{1,3}(?:,\\d{3})+|\\d+)"; const num=x=>String(x).replace(/,/g,"");
  const bare=new Set(); // results that need no parentheses next to + or −
  const pars=(e,op)=>{ if(!/[+−×÷]/.test(e)) return e; if(bare.has(e) && (op==="+"||op==="−")) return e; return `(${e})`; };
  const OPW={plus:"+",minus:"−","take away":"−",times:"×","divided by":"÷",add:"+",subtract:"−","multiply by":"×","divide by":"÷"};
  const K={twice:2,double:2,triple:3};
  let ambiguous=null;
  const bareSum=x=>/^[\d\s,]+[+−][\d\s,+−×÷]*$/.test(x.trim()) || /^[\d\s,×÷]+[+−]/.test(x.trim()); // "20 − 1" typed with no parentheses after "half of" / "twice"
  const twoWays=(t,a,b)=>{ ambiguous=`"${t}" can be read two ways: ${a} or ${b}. Type the expression the way your page means it, with parentheses, like ${a}.`; return null; };
  const rd=(t,depth,noInfix)=>{ if(depth>8) return null; t=t.trim().replace(/^the /,"").replace(/,$/,""); let m;
    if(new RegExp(`^${NUMRE}$`).test(t)) return num(t);
    if(/^[\d\s,+−×÷()\[\]]+$/.test(t) && /[+−×÷]/.test(t)){ // already an expression ("6 × 3", "(17 + 9)")
      try{ const tk=parseBack(t.replace(/(\d),(?=\d{3}\b)/g,"$1")); const e=tokStr(tk); return tk.length===1 && typeof tk[0]==="object" ? tokStr(tk[0].grp) : e; }catch(err){ return null; } }
    if((m=t.match(/^(.+?),? then (add|subtract|multiply by|divide by|times|minus|plus) (.+)$/))){ const e=rd(m[1],depth+1), n=rd(m[3],depth+1); const op=OPW[m[2]]; return e&&n&&`${pars(e,op)} ${op} ${pars(n,op)}`; }
    if((m=t.match(/^half (?:of )?(\d[\d,]*) ([+−]) (\d[\d,]*)$/))){ ambiguous=`Is that half of ${m[1]}, then ${m[2]==="+"?"plus":"minus"} ${m[3]} (${m[1]} ÷ 2 ${m[2]} ${m[3]}), or half of (${m[1]} ${m[2]} ${m[3]})? Type it the way your page means it, like ${m[1]} ÷ 2 ${m[2]} ${m[3]} or (${m[1]} ${m[2]} ${m[3]}) ÷ 2.`; return null; }
    if(!noInfix && (m=t.match(new RegExp(`^(.+) (plus|minus|take away|times|divided by) ${NUMRE}$`)))){ const e=rd(m[1],depth+1); const op=OPW[m[2]];
      if(e){ const r=`${pars(e,op)} ${op} ${num(m[3])}`;
        if(/^(?:subtract|add|multiply|divide|twice|double|triple|\d+ times|two times|three times|four times|five times)\b/.test(m[1].replace(/^the /,""))){ const alt=rd(t,depth,true); if(alt && alt!==r) return twoWays(t, r, alt); } // "subtract 2 from 9 plus 4": (9 − 2) + 4 or (9 + 4) − 2
        return r; } }

  // Class position: the district calendar's estimate, or a lesson pinned here from the homework header
  const L=lessonList(), classId=effectiveClassAt(), calId=calendarClassAt();
  const byUnit=[]; for(const l of L){ if(!l) continue; let g=byUnit.find(x=>x.unit===l.unit); if(!g){ g={unit:l.unit, ls:[]}; byUnit.push(g); } g.ls.push(l); }
  const optLabel=l=>`${lessonShort(l)} · ${l.name}${l.std?` · ${l.std}${l.stdNote?" (the guide prints a different code; see note)":""}`:""}${l.type?` · ${l.type}`:""}${l.inferred?" (inferred)":""}${lessonSkills(l).length?"":" · not in the app yet"}`;
  const lessonOpts=byUnit.map(g=>`<optgroup label="${esc(unitTitle(g.unit))}">${g.ls.map(l=>`<option value="${esc(l.id)}" ${l.id===classId?"selected":""}>${esc(optLabel(l))}</option>`).join("")}</optgroup>`).join("");
  const classModeHTML=()=>S.classPin
    ? `<b>Pinned by you:</b> ${esc(lessonShortById(S.classPin))}. The district calendar puts the class at ${calId?esc(lessonShortById(calId)):"—"} today.`
    : `<b>Following the district calendar:</b> ${calId?esc(lessonShortById(calId)):"—"} today (estimated from the unit dates, weekdays only).`;
  // Skill → lesson table, grouped by unit, with lesson type letters
  const covered=byUnit.filter(g=>g.ls.some(l=>lessonSkills(l).length));
  const coveredUnits=new Set(covered.map(g=>g.unit));
  const allUnits = unitList().length ? unitList().map(u=>u.unit) : byUnit.map(g=>g.unit);
  const notYetUnits=allUnits.filter(n=>!coveredUnits.has(n)).map(n=>esc(unitTitle(n)));
  const lessonTag=l=>`<span class="tag">L${esc(l.lesson)}${l.type?` ${esc(l.type)}`:""}</span>`;
  const skillMap=covered.map(g=>{ const skillsIn=SKILL_ORDER.filter(k=>g.ls.some(l=>lessonSkills(l).includes(k)));
    const missing=g.ls.filter(l=>!lessonSkills(l).length);
    return `<tr class="unit-row"><th colspan="2" scope="colgroup">${esc(unitTitle(g.unit))}</th></tr>`
      + skillsIn.map(k=>`<tr><td>${SKILLS[k].name}</td><td>${g.ls.filter(l=>lessonSkills(l).includes(k)).map(lessonTag).join(" ")}</td></tr>`).join("")
      + (missing.length?`<tr><td class="muted">Not in the app yet</td><td class="muted">${missing.map(l=>`L${esc(l.lesson)}${l.type?` ${esc(l.type)}`:""}`).join(", ")}</td></tr>`:""); }).join("");
  const classHTML = L.length ? `
    <div class="card">
      <h2 style="margin-top:0">Class position</h2>
      <p class="muted" style="font-size:14px;margin:0 0 8px">By default the app follows the district pacing calendar. If the homework header says otherwise ("Homework · Unit 2 Lesson 5"), pick that lesson and pin it. "Practice this week" on the home screen draws mostly from this lesson, with some from the two before it for spiral review.</p>
      <p class="muted" style="font-size:14px;margin:0 0 8px"><b>Pin the topic, not just the page number.</b> A page titled "Spiral Review U2 L7" practices Lesson 7's skill even when it sits in Lesson 9's homework. Pin the lesson whose name matches what the page is actually doing; for tonight's exact problem shapes, use "Homework practice" on the home screen, which ignores levels and the calendar.</p>
      <p class="muted classmode" id="classmode" style="font-size:14px;margin:0 0 8px" role="status" aria-live="polite">${classModeHTML()}</p>
      <label class="vh" for="classat">Lesson the class is on</label>
      <div class="row"><select class="sel" id="classat">${lessonOpts}</select></div>
      <div class="actions" style="margin-top:10px"><button class="btn" id="saveclass">Save (pin this lesson)</button><button class="btn quiet" id="followcal">Follow the calendar</button><span class="muted" id="classsaved" style="font-size:13px" role="status" aria-live="polite"></span></div>
      <h2>Which lessons each skill practices</h2>
      <div style="overflow-x:auto"><table class="report"><tr><th>Skill here</th><th>Lessons</th></tr>${skillMap||`<tr><td colspan="2" class="muted">No lesson in the list has a skill here yet.</td></tr>`}</table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Lesson types: C = concept lesson, P = practice lesson, MT = unit review.</p>
    </div>` : "";
  const notYetUnitsHTML = notYetUnits.length ? `<p class="muted" style="font-size:13px;margin:10px 0 4px">Units with nothing in the app yet:</p><ul class="units muted">${notYetUnits.map(t=>`<li>${t}</li>`).join("")}</ul>` : "";
  const notYet = typeof NOT_YET_COVERED==="string" && NOT_YET_COVERED.trim() ? NOT_YET_COVERED : `See the lesson map above for what each skill covers.`;
  app.innerHTML=`
    <div class="topbar"><button class="btn quiet" id="back">Home</button><h1 style="margin:0">${esc(S.name)}'s progress</h1><span class="muted build">Build ${esc(BUILD)}</span></div>${warnHTML()}
    <p class="muted" style="margin:6px 0 0">${(()=>{ const cls=e=>classifyEntry(e); const wk=log.filter(e=>Number.isFinite(e.t)&&e.t>=weekAgo); const wi=wk.filter(e=>["independent","indep-miss"].includes(cls(e))); const wiR=wi.filter(e=>cls(e)==="independent").length; const wHelp=wk.filter(e=>["supported","prompted","guided"].includes(cls(e))).length; const wCopied=wk.filter(e=>cls(e)==="copied").length;
      const c={}; for(const e of log){ const k=cls(e); c[k]=(c[k]||0)+1; } let lastCopied=-1; log.forEach((e,i)=>{ if(cls(e)==="copied") lastCopied=i; }); const sinceCopied=log.slice(lastCopied+1).filter(e=>cls(e)==="guided").length;
      return `Last 7 days: ${wk.filter(e=>isFresh(e)&&!e.abandoned).length} problems${wk.filter(e=>e.abandoned).length?` (plus ${wk.filter(e=>e.abandoned).length} left before answering)`:""} on ${days} day${days===1?"":"s"}: independent ${wi.length?`${wiR} right of ${wi.length} (${Math.round(100*wiR/wi.length)}%)`:"none yet"}, ${wHelp} finished with help${wCopied?`, ${wCopied} with the answer shown`:""}. ${S.logTrimmed?`Saved history (the most recent ${log.length} records)`:"All time"}: independent ${c.independent||0} right of ${(c.independent||0)+(c["indep-miss"]||0)}; supported (tools or full coach on) ${c.supported||0}; prompted (a nudge opened) ${c.prompted||0}; guided ${c.guided||0}; copied (answer shown) ${c.copied||0}${c["placement-miss"]?`; quick checks or warm-ups on new skills missed (not scored) ${c["placement-miss"]}`:""}. Guided completions since the answer was last shown: ${sinceCopied}.`; })()}${(()=>{ const w=log.filter(e=>e.why!==undefined); return w.length?` "Say why" questions: ${w.filter(e=>e.why).length} of ${w.length} right.`:""; })()}</p>
    ${tiersHTML(log)}
    ${nsGrownupsHTML()}${quickGrownupsHTML()}
    ${classHTML}
    <div class="card">
      <h2 style="margin-top:0">By skill</h2>
      <div style="overflow-x:auto"><table class="report"><tr><th>Skill</th><th>Level</th><th>Independent<br><span style="text-transform:none;letter-spacing:0">right / tried, last 20</span></th><th>Supported<br><span style="text-transform:none;letter-spacing:0">right, supports or coach on (+ nudge opened)</span></th><th>Guided<br><span style="text-transform:none;letter-spacing:0">finished with help</span></th><th>Copied<br><span style="text-transform:none;letter-spacing:0">answer shown, typed in</span></th><th>Common mistake</th></tr>${rows}</table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Only problems done fresh with no hints, no opened nudge, and no coach card or tools on screen move levels: up after 3 right out of the last 4, down after 2 wrong out of the last 3. Hints, follow-ups, walkthroughs, and homework practice never move levels, up or down. Level ${MAX_LEVEL} mixes every trap at once. A guided completion is a problem finished with hints, inside a walkthrough, or on the follow-up. After a right answer, some skills ask one "say why" question in SWUN-style explain-and-prove wording; it is recorded but never moves a level. "Finished with the answer shown" means the answer was displayed after a third miss and typed in to move on; it is recorded, but it is not a right answer or a guided completion.</p>
      ${S.logTrimmed>0?`<p class="muted" style="font-size:13px;margin:6px 0 0">History shows the most recent ${LOG_CAP} attempts; older entries were trimmed.</p>`:""}
    </div>
    <div class="card">
      <h2 style="margin-top:0">Recent misses</h2>
      ${misses.length?misses.map(e=>`<div class="miss"><div class="meta">${missMeta(e)}${e.whyMiss?" · <span class=\"tag\">reason</span>":""}</div><div class="q">${esc(str(e.q))||"<span class=\"muted\">(question not recorded)</span>"}</div>${e.whyMiss?`<div class="a">Answer <span class="good">${esc(str(e.ans))}</span> was right. Reason picked: <span class="bad">${esc(str(e.whyPick))||"—"}</span><br>The reason: <span class="good">${esc(str(e.whyRight))||"—"}</span></div>`:`<div class="a">Answered <span class="bad">${esc(str(e.yours))||"—"}</span> · correct: <span class="good">${esc(str(e.ans))||"—"}</span></div>`}</div>`).join(""):`<p class="muted">No misses logged yet.</p>`}
    </div>
    <div class="card">
      <h2 style="margin-top:0">Move to a new iPad</h2>
      <p class="muted" style="font-size:14px;margin:0 0 8px">Progress lives only inside the copy of the app it was made in. The <b>Home Screen icon</b> and <b>Safari</b> each keep their own copy, so do both steps inside the copy Lily actually uses.</p>
      <ol class="muted" style="font-size:14px;margin:0 0 10px 18px;padding:0;line-height:1.5">
        <li><b>On this iPad:</b> tap <b>Copy transfer code</b> (or <b>Share</b> it to the new iPad with AirDrop).</li>
        <li><b>On the new iPad:</b> open the app the same way (Home Screen icon), tap <b>For grown-ups</b>, paste the code into <b>Restore</b> below, and tap Restore. Same iCloud account? Copy on one iPad and paste on the other; the clipboard carries over on its own.</li>
      </ol>
      <label class="row" style="font-size:14px;gap:8px;margin:0 0 8px"><input type="checkbox" id="tchist" checked> Include the attempt history (longer code; the grown-ups page on the new iPad keeps every miss)</label>
      <div class="actions" style="margin-top:0"><button class="btn primary" id="tcopy">Copy transfer code</button>${typeof navigator!=="undefined"&&navigator.share?`<button class="btn" id="tshare">Share…</button>`:""}<button class="btn quiet" id="tshow">Show the code</button><span class="muted" id="tmsg" style="font-size:13px" role="status" aria-live="polite"></span></div>
      <textarea class="io" id="tcode" readonly hidden aria-label="Transfer code"></textarea>
      <h2>Plain backup text</h2>
      <p class="muted" style="font-size:14px;margin:0 0 8px">The same progress as readable text, for keeping a copy in Notes or email. Either form pastes into Restore.</p>
      <label class="vh" for="export">Backup text</label>
      <textarea class="io" id="export" readonly>${esc(exportText)}</textarea>
      <div class="muted" style="font-size:13px;margin-top:4px">${fmtBytes(new Blob([exportText]).size)} · ${nPlayers} player${nPlayers===1?"":"s"}</div>
      <div class="actions" style="margin-top:8px"><button class="btn" id="copy">Copy backup</button><span class="muted" id="copied" style="font-size:13px" role="status" aria-live="polite"></span></div>
      <h2>Restore</h2>
      <label class="vh" for="import">Paste a transfer code or backup here</label>
      <textarea class="io" id="import" placeholder="Paste a transfer code (starts with LM1.) or backup text here"></textarea>
      <div class="inline-err" id="imperr" role="status" aria-live="polite"></div>
      <div class="actions" style="margin-top:8px"><button class="btn" id="doimport">Restore</button></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">What this app covers</h2>
      <p class="muted" style="font-size:14px;margin:0 0 8px">Mapped to the California Mathematics Framework, Grade Five (CDE), which uses the Common Core standard codes. This app is decimal place-value practice; it is not a full fifth-grade program.</p>
      <div style="overflow-x:auto"><table class="report"><tr><th>Skill here</th><th>Standard</th></tr>${SKILL_ORDER.map(k=>`<tr><td>${SKILLS[k].name}</td><td>${SKILLS[k].std}</td></tr>`).join("")}</table></div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">${esc(notYet)}</p>
      ${notYetUnitsHTML}
    </div>
    <div class="card">
      <h2 style="margin-top:0">Danger zone</h2>
      <div class="actions" style="margin-top:0"><button class="btn danger" id="reset">Reset ${esc(S.name)}'s levels</button><button class="btn danger" id="remove">Remove player ${esc(S.name)}</button></div>
    </div>`;
  const q=id=>app.querySelector("#"+id);
  q("back").onclick=home; q("back").focus({preventScroll:true});
  const setClassMode=()=>{ const m=q("classmode"); if(m) m.innerHTML=classModeHTML(); };
  bindNsGrownups();
  if(q("paperSave")) q("paperSave").onclick=()=>{ const sk=q("paperSk").value; const qtxt=String(q("paperQ").value||"").trim(); const okv=(app.querySelector("input[name=paperOk]:checked")||{}).value==="1"; const helped=q("paperHelp").checked; const changedForm=q("paperForm").checked;
    if(!SKILLS[sk]) return; pushLog({t:Date.now(), sk, q: qtxt?`paper: ${qtxt}`:"paper problem", yours:"", ans:"", ok:okv?1:0, stage:"paper", hints:0, independent:0, transfer:1, parentScored:1, helped:helped?1:0, changedForm:changedForm?1:0, lvl:S.levels[sk]});
    if(!okv){ noteComp(sk, "*", false, {lvl:S.levels[sk]}); } // a paper miss opens the skill for Focus, like any miss
    save(); grownups(); const msg=app.querySelector("#paperMsg"); if(msg) msg.textContent="Recorded."; };
  if(q("saveclass")) q("saveclass").onclick=()=>{ const id=q("classat").value; const l=lessonById(id);
    if(!l){ q("classsaved").textContent="Pick a lesson from the list."; return; }
    S.classPin=l.id; const okSave=save(); q("classsaved").textContent=okSave?`Pinned: ${lessonShort(l)}.`:"Pinned for now, but this device refused to save it."; setClassMode(); };
  if(q("followcal")) q("followcal").onclick=()=>{ S.classPin=null; const okSave=save(); const id=calendarClassAt(); if(id) q("classat").value=id;
    q("classsaved").textContent=okSave?`Following the calendar: ${id?lessonShortById(id):"—"} today.`:"Following the calendar for now, but this device refused to save it."; setClassMode(); };
  q("copy").onclick=async()=>{ const ta=q("export"); ta.select(); let done=false; try{ await navigator.clipboard.writeText(ta.value); done=true; }catch(e){ try{ done=document.execCommand("copy"); }catch(e2){} } q("copied").textContent=done?"Copied.":"Select the text and copy it by hand."; };
  q("doimport").onclick=async()=>{ q("imperr").textContent="Checking…"; const r=await importBackupText(q("import").value); if(!r.ok){ q("imperr").textContent=r.err; return; } if(r.err){ q("imperr").textContent=r.err; return; } home(); };
  const codeFor=async()=>makeTransferCode(DB, q("tchist").checked);
  const copyText=async(text)=>{ let done=false; try{ await navigator.clipboard.writeText(text); done=true; }catch(e){ const ta=q("tcode"); ta.hidden=false; ta.value=text; ta.select(); try{ done=document.execCommand("copy"); }catch(e2){} } return done; };
  q("tcopy").onclick=async()=>{ q("tmsg").textContent="Building…"; try{ const code=await codeFor(); const ok=await copyText(code); q("tmsg").textContent= ok ? `Copied (${fmtBytes(code.length)}). Now paste it into Restore on the new iPad.` : "Could not copy automatically; the code is shown below, select it and copy by hand."; if(!ok){ q("tcode").hidden=false; q("tcode").value=code; } }catch(e){ q("tmsg").textContent="Could not build the code: "+(e.message||e); } };
  if(q("tshare")) q("tshare").onclick=async()=>{ try{ const code=await codeFor(); await navigator.share({title:"Math Practice transfer code", text:code}); q("tmsg").textContent="Shared. On the new iPad, copy the code from where it landed and paste it into Restore."; }catch(e){ if(e && e.name!=="AbortError") q("tmsg").textContent="Sharing did not work here; use Copy instead."; } };
  q("tshow").onclick=async()=>{ const ta=q("tcode"); if(!ta.hidden){ ta.hidden=true; q("tshow").textContent="Show the code"; return; } ta.value="Building…"; ta.hidden=false; ta.value=await codeFor(); q("tshow").textContent="Hide the code"; };
  q("reset").onclick=()=>{ if(confirm(`Erase ${S.name}'s levels and history and start from level 1?`)){ const n=S.name; S=normalize(blankProfile(n)); DB.profiles[n]=S; save(); home(); } };
  q("remove").onclick=()=>{ if(confirm(`Remove ${S.name} completely? This cannot be undone (unless you saved a backup).`)){ delete DB.profiles[S.name]; DB.current=null; S=null; save(); home(); } };
}
home();

</script>
</body>
