<style>
:root{
  --paper:#F5F7FA; --card:#FFFFFF; --ink:#1B2A41; --graphite:#5F6B7A; --line:#C8D1DC;
  --hi:#FFE566; --hi-ink:#6B5A00; --ok:#2F9E6B; --ok-bg:#E6F5EE; --no:#C9584F; --no-bg:#FBECEA;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{max-width:600px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
button,input,textarea{touch-action:manipulation}
.skills{display:grid;gap:10px}
.card.two{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.card.two .right{border-left:2px solid var(--line);padding-left:22px;min-height:100%}
@media (min-width:700px){
  .app{max-width:800px;padding-left:28px;padding-right:28px}
  h1{font-size:34px} .muted{font-size:18px}
  .skills{grid-template-columns:1fr 1fr}
  .skill{margin:0;padding:18px 18px} .skill .name{font-size:20px} .skill .blurb{font-size:15px}
  .btn{min-height:56px;font-size:18px;padding:14px 24px}
  .card{padding:26px 28px 28px}
  .prompt{font-size:22px} .big-num{font-size:48px} .big-words{font-size:30px}
  input.ans{font-size:34px;padding:14px 18px}
  .opt{font-size:19px;padding:16px 18px}
  .opts{grid-template-columns:1fr 1fr}
  .opts.long{grid-template-columns:1fr}
  .step{font-size:18px}
  .chart td{width:52px;height:56px;font-size:30px}
  .chart th{font-size:12px} .chart th span{height:88px}
  .chart td.point{font-size:34px}
  pre.stack{font-size:26px}
}
@media (min-width:1000px){
  .app{max-width:1120px}
  .card.two{grid-template-columns:5fr 6fr}
}
.spstrip{display:none}
@media (max-width:999px){ .card.two{grid-template-columns:1fr} .card.two .right{border-left:none;padding-left:0;border-top:2px solid var(--line);padding-top:16px}
  .spwrap{display:flex;gap:6px;align-items:stretch} .spwrap canvas{flex:1;min-width:0} .spstrip{display:block;width:36px;border-radius:10px;background:repeating-linear-gradient(0deg,#E6EAF1 0 8px,#F2F4F8 8px 16px)} } /* v9.12: in one column a 40px strip beside the pad stays scrollable, so a finger can always move the page */
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.01em}
h2{font-size:20px;margin:18px 0 6px}
.muted{color:var(--graphite)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:48px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,.cell:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--hi)} /* v9.12: dark ring (about 14:1) with the yellow halo; yellow alone was 1.26:1 */
.btn.primary{background:var(--ink);color:#fff}
.btn.quiet{border-color:var(--line);color:var(--graphite);font-weight:600}
.btn.small{padding:4px 10px;min-height:0;font-size:13px}
.btn.danger{border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* home */
.skill{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:10px 0;cursor:pointer}
.skill:hover{border-color:var(--ink)}
.skill .name{font-weight:700;font-size:18px}
.skill .blurb{color:var(--graphite);font-size:14px;margin-top:2px}
.dots{display:flex;gap:5px;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.dot.on{background:var(--ink)}
.dot.max{background:var(--hi-ink);border-color:var(--hi-ink)}
.mix{margin-top:14px;width:100%}
.actions .mix{flex:1 1 220px;width:auto}
.stats{margin-top:22px;font-size:14px}
.footer{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}

/* practice */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px 18px 20px;margin-top:12px}
.prompt{font-size:19px;margin:0 0 12px}
.big-num,.big-words{display:block;font-weight:800;font-size:34px;letter-spacing:.01em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.15}
.big-words{font-size:24px;font-weight:700}
sup{font-size:.6em}
input.ans{width:100%;font-size:28px;font-weight:700;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-variant-numeric:tabular-nums}
input.ans::placeholder{color:#6B7684;font-weight:500} /* v9.12: 4.6:1 */
input.ans:disabled{background:#F0F3F7;color:var(--graphite);border-color:var(--line)}
.yours{font-size:13px;color:var(--graphite);margin:10px 0 4px}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:#fff;border:2px solid #8A96A6;border-radius:12px;padding:13px 14px;font-size:16px;cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:#F0F3F7}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.right::after{content:" ✓";font-weight:800;color:#1E6B47}.opt.wrong::after,.opt.crossed::after{content:" ✕";font-weight:800;color:#9E3B33} /* v9.12: not by color alone */
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hints{margin-top:12px}
.hints .step{border-left-color:var(--graphite);font-size:15px;color:var(--graphite)}
.hints .step b{color:var(--ink)}
.hints .chart td{color:var(--ink)}
.inline-err{color:#A8433B;font-size:14px;margin-top:6px;font-weight:600}

/* chart : the hero */
.chart{margin:14px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart table{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}
.chart th{font-weight:600;font-size:11px;color:var(--graphite);padding:0 3px 6px;vertical-align:bottom;line-height:1.1}
.chart th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);height:78px}
.chart td{border:2px solid var(--ink);width:38px;height:44px;text-align:center;font-size:24px;font-weight:800;background:#fff;position:relative}
.chart td.point{border:none;width:14px;background:transparent;font-size:28px;line-height:0;vertical-align:bottom;padding-bottom:6px}
.chart th.point{width:14px}
.chart td.ul{background:var(--hi)}
.chart td.ul::after{content:"";position:absolute;left:6px;right:6px;bottom:5px;height:3px;background:var(--hi-ink);border-radius:2px}
.chart td.circle::before{content:"";position:absolute;inset:4px;border:3px solid var(--ink);border-radius:50%}
.chart td.slide{background:#EEF2F7}
.chart td.pad{color:#9AA5B3}
.chart.compact{margin:8px 0 0}
.chart.compact th span{height:0;display:none}
.chart.compact th{padding:0;height:0}
.chart-label{font-size:12px;color:var(--graphite);text-align:center;margin-top:6px;font-weight:600}
pre.stack{font-family:Menlo,Consolas,"Courier New",monospace;font-size:22px;font-weight:700;line-height:1.35;margin:10px auto 4px;display:table;text-align:right;background:#F7F9FC;border:2px solid var(--line);border-radius:10px;padding:10px 18px;font-variant-numeric:tabular-nums}
pre.stack .rule{display:block;border-top:3px solid var(--ink);margin-top:2px;padding-top:2px}
pre.stack .pad{color:#9AA5B3}
pre.stack .carry{font-size:.6em;color:var(--hi-ink);vertical-align:top}
pre.stack .cr{color:#B45309;font-weight:600}
.build{font-size:12px;margin-left:auto;align-self:center;white-space:nowrap}
.substep.why{border-style:solid;border-color:var(--ink);background:#fff}
.substep .res.after{margin-top:6px;font-weight:400;color:var(--ink);opacity:.9}
.opt.crossed{text-decoration:line-through;opacity:.45} /* a wrong pick already tried on this step */ /* what the step meant, shown only after she has answered it */
.substep.pre{border:2px solid #E9D8B5;background:#FFFBEF;border-radius:12px;padding:10px 12px;margin:8px 0 12px}
.substep.pre .cq{margin-bottom:6px}
.scratch{margin-top:16px}
.scratch-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:14px}
.scratch canvas{display:block;width:100%;height:300px;border:2px solid var(--line);border-radius:12px;background:#FFFEF8;touch-action:none;cursor:crosshair}
.btn[aria-pressed="true"]{border-color:var(--ink);background:#EEF2F7}

/* multiplication workspace: aligned digit cells, carry boxes, an app number pad */
.ws{margin:8px 0 4px}
.ws-grid{display:inline-grid;gap:4px 3px;margin:0 auto;padding:12px 14px 12px 8px;background:#F7F9FC;border:2px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.ws-wrap{text-align:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ws .cell{width:54px;height:52px;border:2px solid var(--line);border-radius:9px;background:#fff;font-size:26px;font-weight:800;text-align:center;line-height:48px;padding:0;color:var(--ink);cursor:pointer;font-family:Menlo,Consolas,"Courier New",monospace}
.ws .cell.sel{border-color:#1762A6;background:#E9F4FF;box-shadow:0 0 0 3px #B9DCFC;position:relative;z-index:1}
.ws-direction{max-width:420px;margin:0 auto 10px;padding:10px 12px;border:2px solid #D6E5F4;border-radius:10px;background:#F1F7FC;text-align:left;font-size:15px;line-height:1.35}
.ws-direction b{display:block;font-size:17px;margin-bottom:2px}
.ws-direction .ws-current{display:block;margin-top:4px;color:var(--hi-ink);font-weight:700}
.ws-howto{font-size:13px;color:var(--graphite);text-align:center;margin:8px 0 0}
.pad .btn.small-txt{font-family:inherit;font-size:15px}

<body>
<div class="app" id="app"></div>
<script>
// ===== Number words =====
const ONES = ["", "one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["", "", "twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function words(n){
  n = Math.floor(n);
  if(n===0) return "zero";
  if(n<20) return ONES[n];
  if(n<100) return TENS[Math.floor(n/10)] + (n%10 ? "-"+ONES[n%10] : "");
  if(n<1000) return ONES[Math.floor(n/100)]+" hundred"+(n%100 ? " "+words(n%100) : "");
  if(n<1e6) return words(Math.floor(n/1000))+" thousand"+(n%1000 ? " "+words(n%1000) : "");
  return words(Math.floor(n/1e6))+" million"+(n%1e6 ? " "+words(n%1e6) : "");
}
const DEC_PLACES = ["tenths","hundredths","thousandths"];
const WHOLE_PLACES = ["ones","tens","hundreds","thousands","ten thousands","hundred thousands","millions","ten millions","hundred millions"];
const DEC_FRACTION = ["1/10","1/100","1/1000"];
const WHOLE_VALUE = ["1","10","100","1,000","10,000","100,000","1,000,000","10,000,000","100,000,000"];
const WHOLE_SING=["one","ten","hundred","thousand","ten thousand","hundred thousand","million","ten million","hundred million"];
const DEC_SING=["tenth","hundredth","thousandth"];
const decWords=(n,idx)=>words(n)+" "+(n===1?DEC_SING:DEC_PLACES)[idx]; // "one tenth", "seven tenths"
const MAX_LEVEL=5;

// A decimal number is {w: integer whole, d: string of decimal digits ("" allowed; trailing zeros kept if present)}
function fmt(num){ const w = num.w.toLocaleString("en-US"); return num.d ? w+"."+num.d : w; }
function numValue(num){ return parseFloat(num.w+"."+(num.d||"0")); }
function toWordForm(num){
  const parts=[];
  if(num.w>0) parts.push(words(num.w));
  if(num.d){
    const di = parseInt(num.d,10);
    const dw = words(di)+" "+(di===1 ? DEC_SING : DEC_PLACES)[num.d.length-1]; // v9.12: "one tenth", not "one tenths"
    if(num.w>0) parts.push("and "+dw); else parts.push(dw);
  }
  if(!parts.length) return "zero";
  return parts.join(" ");
}
function trimDec(d){ return d.replace(/0+$/,""); }
function fromThousandths(V){ const w=Math.floor(V/1000); const d=String(V%1000).padStart(3,"0"); return {w, d: trimDec(d)}; }
function fixedFrom(V, places){ const w=Math.floor(V/1000); const d=String(V%1000).padStart(3,"0").slice(0,places); return {w,d}; }
function padTo(num,k){ return {w:num.w, d:(num.d||"").padEnd(k,"0")}; }
function toThousandths(num){ return num.w*1000 + parseInt((num.d||"").padEnd(3,"0"),10); }
function plural(n,s){ return n+" "+s+(n===1?"":"s"); }
function near(a,b){ return Math.abs(a-b)<1e-9; }

// ===== random helpers =====
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = arr=>arr[ri(0,arr.length-1)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }
function nonZeroDigits(k){ let s=""; for(let i=0;i<k;i++) s+=ri(1,9); return s; }
function digitsNoTrail(k){ if(k<=0) return ""; let s=""; for(let i=0;i<k-1;i++) s+=ri(0,9); return s+ri(1,9); }
function digitsWithLeadingZeros(k, z){ let s=""; for(let i=0;i<z;i++) s+="0"; s+=ri(1,9); for(let i=z+1;i<k;i++) s+=ri(0,9);
  if(s.endsWith("0")) s=s.slice(0,-1)+ri(1,9); return s; }

// ===== Checks (interactive substeps) =====
const ci=(q,answer,display)=>({q, type:"input", answer, display: display!==undefined ? String(display) : String(answer)});
const cm=(q,options,answer)=>({q, type:"mc", options, answer, display:options[answer]});
const wc=(check,comp)=>{ check.comp=comp; return check; }; // tag a check with the component it tests (a string, or a function of her answer → component)
// options with tags, de-duplicated by text, correct always kept
function buildOptions(correct, distractors){ // distractors: [{text, tag}]
  const seen=new Set([correct]); const list=[{text:correct, tag:"correct"}];
  for(const d of distractors){ if(d.text && !seen.has(d.text)){ seen.add(d.text); list.push(d); } if(list.length>=4) break; }
  const sh=shuffle(list);
  return {options:sh.map(o=>o.text), optionTags:sh.map(o=>o.tag), answer:sh.findIndex(o=>o.tag==="correct")};
}
function finalCheck(p){ // the last walkthrough step asks for the whole answer
  return p.type==="input" ? ci(`Now you finish it. Type the answer.`, p.answer, p.display) : cm(`Now you finish it. Pick the answer.`, p.options, p.answer);
}

// ===== Chart model =====
function chartModel(num, minWholeCols=1){
  const ws = String(num.w);
  const cols = Math.min(WHOLE_PLACES.length, Math.max(ws.length, minWholeCols));
  const whole=[];
  for(let i=cols-1;i>=0;i--){ const idx = ws.length-1-i; whole.push({place:WHOLE_PLACES[i], digit: idx>=0 ? ws[idx] : "", key:"w"+i}); }
  const dec=[];
  for(let i=0;i<3;i++) dec.push({place:DEC_PLACES[i], digit: (num.d && num.d[i]) || "", key:"d"+(i+1)});
  return {whole, dec};
}

// ===== Generators =====
// Each returns {skill, level, prompt, type, answer, options?, optionTags?, display, steps:[{t, chart?, charts?, hl?, minCols?, check?}], hints:[...], show, minCols?, meta}
// `focus` (optional) = {tag, ...} from focusFor(): steer the variant toward the mistake just made.

function genStandard(level, focus){
  const f=focus&&focus.tag;
  let w, d;
  if(level===1){ w=ri(1,9); d=nonZeroDigits(ri(1,2)); }
  else if(level===2){ w=ri(1,99); d=nonZeroDigits(3); }
  else if(level===3){ w=ri(1,99); d=digitsWithLeadingZeros(ri(2,3), 1); }
  else if(level===4){ const zeros=ri(1,2); const k=Math.max(zeros+1, ri(2,3)); w = Math.random()<0.5 ? 0 : ri(1,999); d=digitsWithLeadingZeros(k, zeros); }
  else { w=pick([0, ri(1,99), ri(100,999), ri(1000,9999)]); const z=ri(0,2); d = z ? digitsWithLeadingZeros(3,z) : nonZeroDigits(ri(1,3)); }
  if(f==="zeros"){ const k=Math.max(2,d.length); d=digitsWithLeadingZeros(k, ri(1,k-1)); }           // zeros after the dot were the problem
  if(f==="whole" && w===0) w=ri(1,99);                                                                   // whole part was the problem
  if(f==="no-whole") w=0;
  const num={w,d};
  const wf=toWordForm(num);
  const k=d.length, di=parseInt(d,10), dgs=String(di).length, place=DEC_PLACES[k-1], lastWord=(di===1?DEC_SING:DEC_PLACES)[k-1];
  const steps=[];
  if(w>0) steps.push({t:`Find the word <b>and</b>. It marks the decimal point. Everything before it is the whole number part.`, cues:[`The words before "and" are the whole number. Read just those.`, `Write that whole number from its words: hundreds, then tens, then ones.`], check:ci(`What is the whole number?`, w, w.toLocaleString("en-US"))});
  else steps.push({t:`There is no word <b>and</b> in this problem. That means there is <b>no whole number</b>. A 0 holds the ones place.`, cues:[`Is there an "and" anywhere? If not, there is no whole number part.`, `With no whole number, one digit still has to hold the ones place before the decimal point. Which digit means "none"?`], check:cm(`What goes to the left of the decimal point?`, ["0","Nothing, start with the decimal point","The first word"], 0)});
  steps.push({t:`The last word is <b>${lastWord}</b>. So the last digit must be in the ${place} place.`, cues:[`Count the places outward from the decimal point: tenths first, then hundredths, then thousandths.`, `Say the places from the decimal point outward: tenths, hundredths, thousandths. Stop at ${place} and count how many you said.`], check:ci(`How many places after the decimal point is the ${place} place?`, k)});
  steps.push({t:`The decimal part says <b>${words(di)}</b>. As a plain number that is <b>${di}</b>, which has <b>${dgs}</b> digit${dgs>1?"s":""}.`});
  if(dgs<k) steps.push({t:`${dgs} is fewer than ${k}. Zeros go between the decimal point and the ${di}, so the last digit lands in the ${place} place.`, cues:[`The digits ${di} must end in the ${place} place. How many places sit empty before them?`, `${k} places to fill and only ${dgs} digit${dgs===1?"":"s"}: the difference is the number of zeros.`], check:ci(`How many zeros go right after the decimal point?`, k-dgs)});
  else steps.push({t:`That is exactly ${k} digit${k>1?"s":""}, so <b>no zeros are needed</b>. The digits fill the places exactly.`, cues:[`Compare: how many places are there, and how many digits do you have?`, `The digits fill every place exactly, so nothing is left to fill with a zero.`], check:ci(`How many zeros go right after the decimal point?`, 0)});
  const p={skill:"standard", level, prompt:`Write the standard form for<br><span class="big-words">${wf}</span>`, type:"input", answer:numValue(num), display:fmt(num), show:"blank", meta:{num,k,dgs}};

const normNum=str=>String(str).replace(/[\uFF10-\uFF19]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFF10+48)).replace(/[\u2212\u2013\uFF0D]/g,"-").replace(/\uFF0E/g,".").replace(/[\u00A0\u2009\u202F]/g," ");
function parseAnswer(str){
  const t=normNum(str).trim(); if(/[\d.]\s+[\d.]/.test(t) && !/^-?\d{1,3}( \d{3})+(\.\d+)?$/.test(t)) return NaN; // "5 7" is not 57; "5 .7" is not 5.7
  if(t.includes(",") && !/^-?\d{1,3}(,\d{3})+(\.\d*)?$/.test(t.replace(/\s/g,""))) return NaN; // "0,5" and "1,0001" are not numbers here
  const s=t.replace(/[,\s]/g,"");
  if(!/^-?\d*\.?\d+$|^-?\d+\.?\d*$/.test(s)) return NaN;
  return parseFloat(s);
}
function checkInput(prob, str){
  if(prob.text) return typeof prob.validate==="function" ? !!prob.validate(String(str)) : String(str).trim()===String(prob.display).trim();
  const v=parseAnswer(str); if(isNaN(v)) return false;
  if(typeof prob.validate==="function") return !!prob.validate(v, str);
  return Math.abs(v-prob.answer)<1e-9;
}
function checkAccepts(check, str){
  if(check.text) return typeof check.validate==="function" ? !!check.validate(String(str)) : String(str).trim()===String(check.display).trim();
  const v=parseAnswer(str); if(isNaN(v)) return false;
  if(typeof check.validate==="function") return !!check.validate(v, str);
  if(Math.abs(v-check.answer)<1e-9) return true;
  return Array.isArray(check.accept) && check.accept.some(a=>Math.abs(v-a)<1e-9);
}
// A message about the INPUT itself (not about being wrong), or "" if the input is usable.
function inputIssue(target, str){
  const s=String(str).trim();
  if(!s) return "Type an answer first.";
  if(target && target.text) return "";
  const cleaned=normNum(s).replace(/[,\s]/g,"");
  if(/^-?\d+,\d{1,2}$/.test(s)) return "Use a point for the decimal, like 0.5 (not 0,5).";
  if(/[\d.]\s+[\d.]/.test(normNum(s)) && isNaN(parseAnswer(s))) return "Take out the space inside the number.";
  if((cleaned.match(/\./g)||[]).length>1) return "A number can only have one decimal point.";
  if(s.includes(",") && !/^-?\d{1,3}(,\d{3})+(\.\d*)?$/.test(s.replace(/\s/g,""))) return "Commas go between groups of three digits, like 1,234 or 72,585.";
  if(/[^0-9.\-]/.test(cleaned)) return "Type a number, like 72.585 (digits and one decimal point).";
  if(isNaN(parseAnswer(s))) return "Type a number, like 72.585";
  return "";
}


// ===== Mistake diagnosis =====
// yours: typed string (input problems) or selected option index (mc problems)
const NOTES={
  "regroup":"That is what you get when a place adds up past 9 (or comes up short) and the regrouping gets lost. Watch the place that needs regrouping.",
  "alignment":"That is what you get when you line up the <b>ends</b> of the numbers instead of the <b>decimal points</b>.",
  "chop":"That is the number with its extra digits dropped, not rounded. When the circled digit is 5 or greater, the underlined digit goes up.",
  "direction":"You rounded the wrong way. Look at the circled digit: 5 or greater goes up, 4 or less stays.",
  "place":"You rounded to a different place than the one asked for. Underline the rounding place first.",
  "half-up":"That one looks close, but its circled digit is 5, so it rounds up, not down.",
  "below":"That one rounds down to the number below the target.",
  "above":"That one rounds to the number above the target.",
  "count":"The decimal point moved the wrong number of places. Count the zeros in the power of ten: one place per zero.",
  "trailing-zeros":"The number already ended in zeros. Keep those and add one more zero for each place the decimal point moves.",
  "shift-dir":"The decimal point moved the wrong way. Multiplying makes a number greater, so the decimal point moves right; dividing makes it less, so the decimal point moves left.",
  "length":"Longer is not greater with decimals. Line up the decimal points and compare place by place from the left.",
  "equal":"Those are not equivalent decimals. Line up the decimal points and compare place by place.",
  "ignore-place":"You compared the decimal digits as if they were whole numbers without giving them the same number of places first.",
  "reversed":"That is the right order, backwards. Check which way the question asked for.",
  "leading-zero":"The zero right after the decimal point is not read aloud, but it still counts as a digit. It moves the place name one more place.",
  "place-name":"The place name comes from how many digits are after the decimal point: 1 is tenths, 2 is hundredths, 3 is thousandths.",
  "missing-place":"Word form needs the place name at the end. Without it, nobody knows how big the decimal part is.",
  "dropped-digit":"A digit went missing. Read all the digits after the decimal point as one number.",
  "whole":"The whole number part slipped. Everything before the decimal point (or before the word 'and') is the whole number part.",
  "skip-zero":"You skipped the zero and moved the next digit into its place. A zero has no value to write, but it still holds its place.",
  "shift":"One value is in the wrong place. Match each digit to the place it is in.",
  "missing-piece":"An addend is missing. Every digit that is not zero has a value to write.",
  "whole-value":"A whole number addend has the wrong value. Check which place that digit is in.",
  "dec-as-whole":"Decimal digits were treated like whole numbers. Digits after the decimal point are worth 1/10, 1/100, 1/1000.",
  "zeros":"The digits are right but they are in the wrong places. Count the zeros you need right after the decimal point.",
  "no-whole":"There is no word 'and', so there is no whole number part. Start with 0 and the decimal point.",
  "two-points":"A number has only <b>one</b> decimal point. Adding a 0 on the end does not make a number greater: 0.05 and 0.050 are equivalent decimals. To change the value, change a digit.",
  "other":""
};
function diagnose(prob, yours){
  let tag="other";
  const m=prob.meta||{};
  if(prob.type==="mc"){ const i=+yours; tag=(prob.optionTags && prob.optionTags[i]) || "other"; if(tag==="correct") tag="other"; }
  else {
    const v=parseAnswer(yours);
    if(!isNaN(v)){
      if(prob.skill==="addsub" && m.nums){
        const {nums,op,k}=m;
        // misaligned: treat numbers as digit strings right-aligned
        const raw=nums.map(x=>parseInt(String(x.w)+x.d,10)); const mis = op==="+" ? raw.reduce((a,b)=>a+b,0) : raw[0]-raw[1];
        const misVals=[mis/Math.pow(10,k), mis/Math.pow(10,Math.max(...nums.map(x=>x.d.length)))];
        // no regrouping: column-wise mod 10 / absolute difference
        const scale=Math.pow(10,3-k); const ints=nums.map(x=>toThousandths(x)/scale); const width=Math.max(...ints.map(x=>String(x).length));
        const digs=ints.map(x=>String(x).padStart(width,"0").split("").map(Number).reverse());
        let nr=0; for(let j=0;j<width;j++){ const col=digs.map(d=>d[j]); const dgt = op==="+" ? col.reduce((a,b)=>a+b,0)%10 : Math.abs(col[0]-col[1]); nr+=dgt*Math.pow(10,j); }
        const nrVal=nr/Math.pow(10,k);
        if(misVals.some(x=>near(x,v))) tag="alignment";
        else if(near(nrVal,v) && !near(v,prob.answer)) tag="regroup";
        else if(hasRegroup(nums,op,k)) tag="regroup";
        else tag="alignment";
      } else if(prob.skill==="rounding" && m.p!==undefined && !m.which){
        const {V,p,R,C}=m; const unit=Math.pow(10,p+3);
        const toV=Math.round(v*1000);
        if(toV===C && C!==R) tag="chop";
        else if(Math.abs(toV-R)===unit) tag="direction";
        else { let other=false; for(let q=-3;q<=6;q++){ if(q!==p && roundV(V,q)===toV){ other=true; break; } } tag = other ? "place" : (toV===V ? "place" : "other"); }
      } else if(prob.skill==="shift" && m.V!==undefined){
        const {V,op,factor}=m; const toV=Math.round(v*1000);
        const wrongDir = op==="×" ? V/factor : V*factor;

        else { const ratio=toV/(op==="×"?V*factor:V/factor); tag = (Math.abs(ratio-10)<1e-6||Math.abs(ratio-0.1)<1e-6||Math.abs(ratio-100)<1e-6||Math.abs(ratio-0.01)<1e-6) ? "count" : "other"; }
      } else if(prob.skill==="powers" && m.V!==undefined){
        const ratio=v/prob.answer; const lg=Math.log10(ratio);
        if(Math.abs(lg-Math.round(lg))<1e-6 && Math.round(lg)!==0) tag = m.baseZeros ? "trailing-zeros" : "count"; else tag="other";
      } else if(prob.skill==="standard" && m.num){
        const {num}=m; const s=String(v);
        const digitsOnly=x=>String(x).replace(/[^0-9]/g,"").replace(/^0+/,"");
        if(Math.floor(v)!==num.w) tag = num.w===0 ? "no-whole" : "whole";
        else if(digitsOnly(s)===digitsOnly(fmt(num).replace(/,/g,"")) || digitsOnly(s.split(".")[1]||"")===digitsOnly(num.d)) tag="zeros";
        else tag="zeros";
      }
    }
  }
  return {tag, note: NOTES[tag]||""};
}
// Build a focus object so the follow-up targets the same mistake
function focusFor(prob, tag){
  const m=prob.meta||{}; const f={tag};
  if(prob.skill==="addsub"){ f.op=m.op; }
  if(prob.skill==="rounding"){ f.p=m.p; f.which=!!m.which; }
  if(prob.skill==="shift"){ f.op=m.op; f.factor=m.factor; if(tag==="shift-dir") f.tag="direction"; }
  if(prob.skill==="powers"){ f.e=m.e; f.variant=m.variant; }
  if(prob.skill==="compare"){ f.order = !!(m.nums); f.open = !!m.open; }

// ===== Progression =====
// hist: last few INDEPENDENT results for a skill (1 = right, 0 = wrong). Returns +1 (level up), -1 (level down), or 0.
// v9.12: a right multiple-choice pick is worth 0.75, a typed answer 1. Moving up needs 3 points in the last four, so four right picks in a row
// (about a 1-in-250 run for a pure guesser on four choices) or a mix with typed answers. Before, three lucky picks in four moved her up.
function applyResult(hist, level, ok, mc){
  hist.push(ok?(mc?0.75:1):0); while(hist.length>6) hist.shift();
  const last4=hist.slice(-4), last3=hist.slice(-3);
  if(ok && last4.length>=3 && last4.reduce((a,x)=>a+(+x||0),0)>=3-1e-9 && level<MAX_LEVEL) return {level:level+1, hist:[], change:+1};
  if(!ok && last3.filter(x=>!x).length>=2 && level>1) return {level:level-1, hist:[], change:-1};
  return {level, hist, change:0};
}

// ===================== Unit 2: expressions, order of operations, prime factorization, multiplication =====================
// Token expressions: an array of numbers, operator strings ("+","−","×","÷") and group objects {grp:[tokens], br:"("|"["}.
const OPS={"+":(a,b)=>a+b,"−":(a,b)=>a-b,"×":(a,b)=>a*b,"÷":(a,b)=>a/b};

function hasGroup(tokens){ return tokens.some(t=>typeof t==="object"); }
// One step of evaluation following the rules. Returns {desc, piece, value, tokens} or null when done.
function stepTokens(tokens){

  for(let i=0;i<tokens.length;i++){ const t=tokens[i];
    if(typeof t==="object"){
      if(hasGroup(t.grp)){ const inner=stepTokens(t.grp); const copy=tokens.slice(); copy[i]={grp:inner.tokens, br:t.br}; return {...inner, tokens:copy, rule:inner.rule}; }

      const inner=stepTokens(t.grp); const copy=tokens.slice(); copy[i]={grp:inner.tokens, br:t.br}; return {...inner, tokens:copy, rule:"group"};
    } }

function traceTokens(tokens){ const out=[]; let cur=tokens; let guard=0; while(guard++<30){ const st=stepTokens(cur); if(!st) break; out.push({before:tokStr(cur), ...st}); cur=st.tokens; } return out; }

// ---- templates ----
function flatTemplate(level){
  const a=ri(2,12), b=ri(2,9), c=ri(2,9), d=ri(2,9);

    ()=>[a,"+",b,"×",c], ()=>[a,"×",b,"+",c], ()=>[a*b+ri(1,9),"−",a,"×",b], ()=>[a,"+",b*c,"÷",c], ()=>[a*b,"÷",b,"+",c],

function genOrderOps(level, focus){

function esc2(s){ return String(s).replace(/</g,"&lt;"); }

function _isoToDate(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); }
// v9.12: MCS 2026-27 non-instruction weekdays, from the district's 2026-27 school calendar (MTA-posted copy, marked DRAFT 04/23/25).
// With these removed, every unit's school-day count equals the pacing guide's "days" (checked for all 11 units in the release tests).
const MCS_NO_SCHOOL=new Set(["2026-09-07","2026-11-11","2026-11-26","2026-11-27",
  ...["21","22","23","24","25","28","29","30","31"].map(d=>"2026-12-"+d), ...["01","04","05","06","07","08","18"].map(d=>"2027-01-"+d),
  "2027-02-08","2027-02-15", ...["22","23","24","25","26","29"].map(d=>"2027-03-"+d), "2027-05-31"]);
const _ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function _schoolDays(a,b){ let n=0; const d=new Date(a); while(d<=b){ const w=d.getDay(); if(w!==0&&w!==6&&!MCS_NO_SCHOOL.has(_ymd(d))) n++; d.setDate(d.getDate()+1); } return n; }
// Estimated lesson for a date: within a unit, spread its lessons evenly over the unit's school days; between units, sit on the previous unit's last lesson (review).
function lessonForDate(date){
  const d=new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const first=UNITS[0], last=UNITS[UNITS.length-1];
  if(d < _isoToDate(first.start)) return LESSONS.find(L=>L.unit===first.unit).id;
  for(let i=0;i<UNITS.length;i++){ const u=UNITS[i]; const st=_isoToDate(u.start), en=_isoToDate(u.end);
    const mine=LESSONS.filter(L=>L.unit===u.unit);
    if(d>=st && d<=en){ const total=Math.max(1,_schoolDays(st,en)); const done=Math.max(0,_schoolDays(st,d)-1); const idx=Math.min(mine.length-1, Math.floor(done/total*mine.length)); return mine[idx].id; }

  q("tshow").onclick=async()=>{ const ta=q("tcode"); if(!ta.hidden){ ta.hidden=true; q("tshow").textContent="Show the code"; return; } ta.value="Building…"; ta.hidden=false; ta.value=await codeFor(); q("tshow").textContent="Hide the code"; };
  q("reset").onclick=()=>{ if(confirm(`Erase ${S.name}'s levels and history and start from level 1?`)){ const n=S.name; S=normalize(blankProfile(n)); DB.profiles[n]=S; save(); home(); } };
  q("remove").onclick=()=>{ if(confirm(`Remove ${S.name} completely? This cannot be undone (unless you saved a backup).`)){ delete DB.profiles[S.name]; DB.current=null; S=null; save(); home(); } };
}
home();

</script>
</body>
</html>
